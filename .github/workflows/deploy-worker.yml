name: Deploy Cloudflare Worker
run-name: Deploy Sanci9517 API (${{ github.sha }})

on:
  push:
    branches:
      - main
    paths:
      - 'worker/**'
      - 'integrations/**'
      - 'core/config.js'
      - 'admin/auth.js'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-worker
  cancel-in-progress: true

env:
  WORKER_URL: https://sanci9517-api.sandor-bogadi95.workers.dev
  PUBLIC_ORIGIN: https://sanci9517.github.io

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: d1 migrations apply DB --remote
          wranglerVersion: '4.33.0'

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
          wranglerVersion: '4.33.0'

      - name: Smoke test production Worker
        shell: bash
        run: |
          set -euo pipefail

          request_json() {
            local path="$1"
            local output="$2"
            local status
            local attempt

            for attempt in $(seq 1 10); do
              status="$(curl --silent --show-error --max-time 20 \
                -o "$output" -w '%{http_code}' \
                -H "Origin: $PUBLIC_ORIGIN" \
                "$WORKER_URL$path" || true)"

              if [[ "$status" =~ ^2[0-9][0-9]$ ]]; then
                cat "$output"
                return 0
              fi

              echo "Worker $path returned HTTP $status (attempt $attempt/10); waiting for propagation..."
              cat "$output" || true
              sleep 3
            done

            echo "Worker $path did not become healthy after 10 attempts."
            return 1
          }

          health="$(request_json /health /tmp/health.json)"
          echo "$health"
          grep -q '"ok":true' <<<"$health"
          grep -q '"workerName":"sanci9517-api"' <<<"$health"
          grep -q '"service":"sanci9517-api"' <<<"$health"

          admin_configured="$(printf '%s' "$health" | python3 -c 'import json,sys; print(str(json.load(sys.stdin).get("integrations", {}).get("admin", {}).get("configured", False)).lower())')"
          if [[ "$admin_configured" != "true" ]]; then
            echo 'Production admin authentication is not configured.'
            echo 'Expected Cloudflare Worker secrets: ADMIN_USERNAME, ADMIN_PASSWORD, ADMIN_AUTH_SECRET.'
            exit 1
          fi

          storage="$(request_json /health/storage /tmp/storage.json)"
          echo "$storage"
          grep -q '"ok":true' <<<"$storage"
          grep -q '"d1":true' <<<"$storage"
          grep -q '"kv":true' <<<"$storage"

          integrations="$(request_json /integrations/status /tmp/integrations.json)"
          echo "$integrations"
          grep -q '"ok":true' <<<"$integrations"
          grep -q '"twitch"' <<<"$integrations"
          grep -q '"youtube"' <<<"$integrations"
          grep -q '"tiktok"' <<<"$integrations"
          grep -q '"admin"' <<<"$integrations"

          auth_status="$(curl --silent --show-error --max-time 20 -o /tmp/auth.json -w '%{http_code}' \
            -H "Origin: $PUBLIC_ORIGIN" \
            "$WORKER_URL/admin/auth/check")"
          cat /tmp/auth.json
          test "$auth_status" = "401"
          grep -q '"authenticated":false' /tmp/auth.json

          cors_headers="$(curl --silent --show-error --max-time 20 -D - -o /dev/null \
            -X OPTIONS \
            -H "Origin: $PUBLIC_ORIGIN" \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type, authorization' \
            "$WORKER_URL/admin/auth/login")"
          echo "$cors_headers"
          grep -qi '^access-control-allow-origin: https://sanci9517.github.io' <<<"$cors_headers"
          grep -qi '^access-control-allow-credentials: true' <<<"$cors_headers"
          grep -qi '^access-control-allow-headers: content-type, authorization' <<<"$cors_headers"

          if [[ -z "${ADMIN_USERNAME:-}" || -z "${ADMIN_PASSWORD:-}" ]]; then
            echo 'GitHub Actions admin smoke-test credentials are not configured.'
            echo 'Set repository secrets ADMIN_USERNAME and ADMIN_PASSWORD without sharing their values in chat.'
            exit 1
          fi

          login_response="$(curl --silent --show-error --max-time 20 \
            -H "Origin: $PUBLIC_ORIGIN" \
            -H 'Content-Type: application/json' \
            -X POST "$WORKER_URL/admin/auth/login" \
            --data-raw "$(printf '{\"username\":\"%s\",\"password\":\"%s\"}' "$ADMIN_USERNAME" "$ADMIN_PASSWORD")")"

          login_ok="$(printf '%s' "$login_response" | python3 -c 'import json,sys; print(str(json.load(sys.stdin).get("ok", False)).lower())')"
          test "$login_ok" = "true"

          admin_token="$(printf '%s' "$login_response" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("token", ""))')"
          test -n "$admin_token"

          check_response="$(curl --silent --show-error --max-time 20 \
            -H "Origin: $PUBLIC_ORIGIN" \
            -H "Authorization: Bearer $admin_token" \
            "$WORKER_URL/admin/auth/check")"
          check_ok="$(printf '%s' "$check_response" | python3 -c 'import json,sys; print(str(json.load(sys.stdin).get("authenticated", False)).lower())')"
          test "$check_ok" = "true"

          echo 'Authenticated admin smoke test passed.'
        env:
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
