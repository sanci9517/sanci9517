name: Deploy Cloudflare Worker
run-name: Deploy Sanci9517 API (${{ github.sha }})

on:
  push:
    branches:
      - main
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-worker
  cancel-in-progress: true

env:
  WORKER_URL: https://sanci9517-api.sandor-bogadi95.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: d1 migrations apply DB --remote
          wranglerVersion: '4.33.0'

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
          wranglerVersion: '4.33.0'

      - name: Smoke test production Worker
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --max-time 20 \
            -H 'Origin: https://sanci9517.github.io' \
            "$WORKER_URL/health")"
          echo "$response"
          grep -q '"ok":true' <<<"$response"
          grep -q '"workerName":"sanci9517-api"' <<<"$response"
          grep -q '"service":"sanci9517-api"' <<<"$response"
