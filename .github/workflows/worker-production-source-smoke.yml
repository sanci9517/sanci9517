name: Production Worker source smoke

on:
  push:
    branches:
      - v2/foundation
    paths:
      - 'public/**'
      - 'src/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/worker-production-source-smoke.yml'

permissions:
  contents: read

concurrency:
  group: production-worker-source-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-readback:
    name: Verify live health and exact changed public source bytes
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact deployed-source candidate
        uses: actions/checkout@v4
      - name: Verify read-only production health and public source SHA-256
        shell: bash
        env:
          WORKER_ORIGIN: https://sanci9517-streamer-brand.sandor-bogadi95.workers.dev
        run: |
          set -euo pipefail
          source_files=("public/visual-page.html" "public/assets/page-renderer.js" "public/editor-v2/core/canvas-engine.js" "public/editor-v2/core/visibility.js" "public/editor-v2/core/element-content.js" "public/editor-v2/core/legacy-media-source.js")
          printf 'Source commit: %s\n' "$GITHUB_SHA"
          for file in "${source_files[@]}"; do
            printf 'Expected %s SHA-256: %s\n' "$file" "$(sha256sum "$file" | awk '{print $1}')"
          done
          for attempt in $(seq 1 35); do
            status="$(curl --connect-timeout 5 --max-time 10 -fsSL -H 'Cache-Control: no-cache' -o "$RUNNER_TEMP/health" -w '%{http_code}' "$WORKER_ORIGIN/api/health?release=$GITHUB_SHA" 2>/dev/null || true)"
            if [[ "$status" == "200" ]]; then
              matched=1
              for file in "${source_files[@]}"; do
                expected="$(sha256sum "$file" | awk '{print $1}')"
                remote="$WORKER_ORIGIN/${file#public/}?release=$GITHUB_SHA"
                output="$RUNNER_TEMP/$(basename "$file")"
                if curl --connect-timeout 5 --max-time 10 -fsSL -H 'Cache-Control: no-cache' "$remote" -o "$output" 2>/dev/null; then
                  actual="$(sha256sum "$output" | awk '{print $1}')"
                  if [[ "$expected" != "$actual" ]]; then
                    printf 'Attempt %s: SHA mismatch %s; live %s, expected %s\n' "$attempt" "$file" "$actual" "$expected"
                    matched=0
                  fi
                else
                  printf 'Attempt %s: cannot fetch live %s\n' "$attempt" "$file"
                  matched=0
                fi
              done
              if [[ "$matched" == "1" ]]; then
                echo "PASS: live /api/health HTTP 200 and all exact public source SHA-256 checks match"
                exit 0
              fi
            else
              printf 'Attempt %s: production HTTP health not yet verified; status %s\n' "$attempt" "$status"
            fi
            sleep 10
          done
          echo 'FAIL: production health and public source SHA-256 checks not verified within bounded retries' >&2
          exit 1
