name: Production Worker source smoke

on:
  push:
    branches:
      - v2/foundation
    paths:
      - 'public/**'
      - 'src/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/worker-production-source-smoke.yml'

permissions:
  contents: read

concurrency:
  group: production-worker-source-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-readback:
    name: Verify live health and exact public renderer bytes
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact deployed-source candidate
        uses: actions/checkout@v4
      - name: Verify read-only production health and renderer SHA-256
        shell: bash
        env:
          WORKER_ORIGIN: https://sanci9517-streamer-brand.sandor-bogadi95.workers.dev
        run: |
          set -euo pipefail
          expected="$(sha256sum public/assets/page-renderer.js | awk '{print $1}')"
          printf 'Source commit: %s\nExpected renderer SHA-256: %s\n' "$GITHUB_SHA" "$expected"
          for attempt in $(seq 1 35); do
            status="$(curl --connect-timeout 5 --max-time 10 -fsSL -H 'Cache-Control: no-cache' -o "$RUNNER_TEMP/health" -w '%{http_code}' "$WORKER_ORIGIN/api/health?release=$GITHUB_SHA" 2>/dev/null || true)"
            if [[ "$status" == "200" ]] && curl --connect-timeout 5 --max-time 10 -fsSL -H 'Cache-Control: no-cache' "$WORKER_ORIGIN/assets/page-renderer.js?release=$GITHUB_SHA" -o "$RUNNER_TEMP/page-renderer.js" 2>/dev/null; then
              actual="$(sha256sum "$RUNNER_TEMP/page-renderer.js" | awk '{print $1}')"
              if [[ "$expected" == "$actual" ]]; then
                printf 'PASS: live /api/health HTTP 200 and public page-renderer.js SHA-256 matches source %s\n' "$actual"
                exit 0
              fi
              printf 'Attempt %s: renderer SHA mismatch; live %s, expected %s\n' "$attempt" "$actual" "$expected"
            else
              printf 'Attempt %s: production HTTP health/asset read not yet verified; health status %s\n' "$attempt" "$status"
            fi
            sleep 10
          done
          echo 'FAIL: production health and exact public renderer hash not verified within bounded retries' >&2
          exit 1
