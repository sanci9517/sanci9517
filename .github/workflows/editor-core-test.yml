name: Editor Core Test

on:
  push:
    branches:
      - v2/foundation
  pull_request:
    branches:
      - v2/foundation
  workflow_dispatch:

jobs:
  editor-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run editor core tests
        run: npm run test:editor

      - name: Test offline D1 ledger reconciliation and bootstrap
        run: |
          python3 tests/d1-ledger-reconciliation.test.py
          node tests/d1-ledger-miniflare.mjs

      - name: Run private R2 media API tests
        run: npm run test:media

      - name: Install Chromium for layout regression
        run: npx playwright install --with-deps chromium

      - name: Run Editor browser layout regression
        run: npm run test:editor:layout

      - name: Run WEB-013 Admin mobile browser regression
        run: npm run test:web013:browser

      - name: Upload Editor layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-layout-screenshots
          path: |
            /tmp/editor-issue42-*.png
            /tmp/creator-ux-p0-*.png
          if-no-files-found: ignore

      - name: Run canonical schedule tests
        run: npm run test:schedule

      - name: Run domain contract tests
        run: npm run test:domain

      - name: Run Brand Kit storage and access regression
        run: npm run test:design

      - name: Run Admin home contract tests
        run: npm run test:admin-home
