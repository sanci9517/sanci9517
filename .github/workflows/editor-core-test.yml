name: Editor Core Test

on:
  push:
    branches:
      - v2/foundation
  pull_request:
    branches:
      - v2/foundation
  workflow_dispatch:

jobs:
  editor-core:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Keep diagnostic artifacts only for failed checks
        run: node --test tests/workflow-artifact-retention.test.mjs

      - name: Run editor core tests
        run: npm run test:editor

      - name: Test offline D1 ledger reconciliation and bootstrap
        run: |
          python3 tests/d1-ledger-reconciliation.test.py
          node tests/d1-ledger-miniflare.mjs
          python3 tests/d1-restore-order.test.py
          node tests/d1-restore-order-miniflare.mjs

      - name: Run private R2 media API tests
        run: npm run test:media

      - name: Install Chromium for layout regression
        run: |
          npx playwright install chromium
          node --input-type=module -e "import {chromium} from 'playwright'; const browser=await chromium.launch({headless:true,args:['--no-sandbox']}); const page=await browser.newPage(); await page.goto('data:text/html,<title>ok</title>'); if(await page.title()!=='ok')process.exitCode=1; await browser.close();"

      - name: Test real Worker media upload with isolated D1 and R2
        run: npm run test:media:storage

      - name: Run Editor browser layout regression
        run: npm run test:editor:layout

      - name: Run WEB-013 Admin mobile browser regression
        run: npm run test:web013:browser

      - name: Run canonical schedule tests
        run: npm run test:schedule

      - name: Run domain contract tests
        run: npm run test:domain

      - name: Run Brand Kit storage and access regression
        run: npm run test:design

      - name: Run Admin home contract tests
        run: npm run test:admin-home

      - name: Upload Editor layout screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: editor-layout-screenshots
          path: |
            /tmp/editor-issue42-*.png
            /tmp/editor-general-fields-ime-*.png
            /tmp/creator-ux-p0-*.png
            /tmp/media-retention-*.png
            /tmp/media-integrity-*.png
            /tmp/media-worker-storage-*.png
          if-no-files-found: ignore
          retention-days: 7
