name: Twitch Integration Check

on:
  push:
    branches:
      - v2/foundation
  workflow_dispatch:

jobs:
  twitch-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run TypeScript typecheck
        run: npm run typecheck
      - name: Run editor core regression tests
        run: npm run test:editor
      - name: Run schedule source regression tests
        run: npm run test:schedule
      - name: Run Twitch OAuth regression tests
        run: node --test tests/twitch-oauth.test.js
