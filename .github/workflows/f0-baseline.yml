name: F0 baseline checks
on:
  push:
    branches: [v2/foundation]
  pull_request:
    branches: [v2/foundation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: node --test tests/editor-multi-validation.test.js
      - run: npm run test:admin-home
      - run: npm run test:web013
      - run: node --test tests/public-navigation.test.js
      - run: node --experimental-loader ./tests/ts-extension-loader.mjs --test tests/admin-pages-sort.test.js
      - run: node --experimental-loader ./tests/ts-extension-loader.mjs --test tests/f1-1-page-navigation-usage.test.js
      - run: node --experimental-loader ./tests/ts-extension-loader.mjs --test tests/f1-1-navigation-migration.test.js tests/f1-1-navigation-route.test.js tests/f1-1-navigation-ui-contract.test.js
      - run: npm run test:admin-access
      - run: node --experimental-loader ./tests/ts-extension-loader.mjs --test tests/auth-session-contract.test.js
      - run: npm run test:domain
      - run: npm run test:editor
      - run: node --test tests/editor-sqlite-concurrency.test.js tests/f0-3-draft-isolation-contract.test.js tests/f0-publish-guard-contract.test.js tests/f0-3-sqlite-parallel-publish.test.js tests/f0-3-public-rollback-cache-contract.test.js
      - run: node --experimental-loader ./tests/ts-extension-loader.mjs --test tests/f0-3-route-integration.test.js
      - run: node --experimental-loader ./tests/ts-extension-loader.mjs --test tests/f1-1-public-route.test.js
      - run: node --experimental-loader ./tests/ts-extension-loader.mjs --test tests/f1-1-page-archive.test.js tests/f1-1-page-archive-ui.test.js tests/f1-1-page-publication-ui.test.js
      - run: npm run test:schedule
