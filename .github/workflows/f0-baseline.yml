name: F0 baseline checks
on:
  push:
    branches: [v2/foundation]
  pull_request:
    branches: [v2/foundation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:admin-home
      - run: npm run test:admin-access
      - run: npm run test:domain
      - run: npm run test:editor
      - run: npm run test:schedule
