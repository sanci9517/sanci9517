<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SANCI9517 | AI Agent</title><link rel="stylesheet" href="admin.css?v=4"><style>.g{display:grid;grid-template-columns:1.4fr .8fr;gap:16px}.p{border:1px solid #292934;background:#0b0b10;border-radius:16px;padding:18px}.o{white-space:pre-wrap;line-height:1.6;padding:16px;border:1px solid #292934;border-radius:12px;background:#08080c;min-height:220px}.c{font-size:12px;max-height:500px;overflow:auto;white-space:pre-wrap}@media(max-width:800px){.g{grid-template-columns:1fr}}</style></head><body><main class="admin-wrap"><header class="top"><div><h1>🤖 SANCI AI Agent</h1><p class="muted">Twitch elemzés + jóváhagyott oldalvezérlés.</p></div><a class="btn" href="admin.html">← Admin</a></header><div class="g"><section class="p"><div class="actions"><button class="btn" data-q="Elemezd a jelenlegi Twitch helyzetet és adj 5 konkrét növekedési lépést.">📊 Twitch</button><button class="btn" data-q="Elemezd az utolsó stream teljesítményét.">🎥 Stream</button><button class="btn" data-q="Adj 10 Fortnite és Hearthstone Shorts ötletet.">🎬 Tartalom</button><button class="btn" data-q="Auditáld a weboldalt és adj javításokat.">🛠️ Audit</button></div><textarea id="q" class="textarea" style="margin-top:14px;min-height:170px" placeholder="Írd le, mit szeretnél az AI-tól..."></textarea><div class="actions" style="margin-top:10px"><button id="run" class="btn primary">AI FUTTATÁSA</button><button id="apply" class="btn" disabled>JAVASLAT ALKALMAZÁSA</button></div><div id="msg" class="muted" style="margin-top:10px">Az AI először javaslatot készít; módosítás csak jóváhagyással történik.</div><div id="out" class="o">Készen állok.</div></section><section class="p"><h2>Aktuális kontextus</h2><div id="ctx" class="c">Betöltés…</div></section></div></main><script>const API='https://sanci9517-twitch-api.sandor-bogadi95.workers.dev',token=sessionStorage.getItem('sanci_admin_session');let cfg={},tw={},actions=null,$=s=>document.querySelector(s);async function init(){try{cfg=await(await fetch('config.json?v='+Date.now())).json()}catch{}try{let x=JSON.parse(localStorage.getItem('sanci_site_config')||'null');if(x)cfg={...cfg,...x}}catch{}try{tw=await(await fetch(API+'/twitch/stats',{headers:token?{Authorization:'Bearer '+token}:{}})).json()}catch{tw={error:'Twitch API'}}$('#ctx').textContent=JSON.stringify({site:cfg,twitch:tw},null,2)}function parse(s){let m=s.match(/```json\s*([\s\S]*?)```/i);if(!m)return null;try{let x=JSON.parse(m[1]);return Array.isArray(x.actions)?x.actions:null}catch{return null}}function setp(o,p,v){let a=p.split('.');for(let i=0;i<a.length-1;i++){if(!o[a[i]]||typeof o[a[i]]!=='object')o[a[i]]={};o=o[a[i]]}o[a[a.length-1]]=v}$('#run').onclick=async()=>{let q=$('#q').value.trim();if(!q)return;$('#run').disabled=true;$('#out').textContent='⏳ AI dolgozik…';actions=null;$('#apply').disabled=true;try{let r=await fetch(API+'/ai/chat',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({prompt:q,mode:'agent',context:{site:cfg,twitch:tw},instructions:'Weboldal-módosításnál a válasz végére adj JSON-t: {"actions":[{"op":"set","path":"tagline","value":"..."}]}. Csak config.json tartalmi mezőit módosítsd, titkot soha.'})});let d=await r.json();if(!r.ok)throw Error(d.error||'AI hiba');$('#out').textContent=d.answer||'Nincs válasz.';actions=parse(d.answer||'');if(actions?.length){$('#apply').disabled=false;$('#msg').textContent='Találtam alkalmazható módosításokat. Ellenőrizd a választ.'}}catch(e){$('#out').textContent='❌ '+e.message}finally{$('#run').disabled=false}};$('#apply').onclick=()=>{if(!actions)return;for(let a of actions)if(a.op==='set'&&a.path)setp(cfg,a.path,a.value);localStorage.setItem('sanci_site_config',JSON.stringify(cfg));$('#ctx').textContent=JSON.stringify({site:cfg,twitch:tw},null,2);$('#msg').textContent='✅ Alkalmazva ezen a böngészőn. A tartós Cloudflare mentéshez /site/config Worker végpont szükséges.';$('#apply').disabled=true;actions=null};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>$('#q').value=b.dataset.q);init();</script></body></html>
