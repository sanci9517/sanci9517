<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SANCI9517 | AI</title><link rel="stylesheet" href="admin.css?v=3"><style>textarea{width:100%;min-height:260px;padding:15px;border:1px solid #292934;background:#08080c;color:#fff;border-radius:13px}.out{white-space:pre-wrap;line-height:1.65;margin-top:15px;padding:18px;border:1px solid #292934;border-radius:13px;background:#08080c;min-height:250px}</style></head><body><main class="admin-wrap"><header class="top"><div><h1>🤖 SANCI AI</h1><p class="muted">Tartalom-, Twitch- és weboldal-elemző.</p></div><a class="btn" href="admin.html">← Admin</a></header><section class="section"><div class="actions"><button class="btn" data-p="Elemezd a jelenlegi Twitch helyzetet és adj 5 konkrét növekedési javaslatot.">📊 Twitch elemzés</button><button class="btn" data-p="Adj 10 Fortnite és Hearthstone Shorts/TikTok ötletet.">🎬 Tartalomötletek</button><button class="btn" data-p="Készíts heti stream-stratégiát Fortnite és Hearthstone játékokra.">📈 Stratégia</button><button class="btn" data-p="Auditáld a SANCI9517 weboldal felépítését és adj fejlesztési tervet.">🛠️ Web audit</button></div><textarea id="p" placeholder="Írd le, mit szeretnél az AI-tól..."></textarea><button id="run" class="btn primary" style="margin-top:10px">AI FUTTATÁSA</button><div id="out" class="out">Készen állok.</div></section></main><script>const API='https://sanci9517-twitch-api.sandor-bogadi95.workers.dev',token=sessionStorage.getItem('sanci_admin_session');document.querySelectorAll('[data-p]').forEach(x=>x.onclick=()=>document.getElementById('p').value=x.dataset.p);document.getElementById('run').onclick=async()=>{const p=document.getElementById('p').value.trim();if(!p)return;document.getElementById('out').textContent='⏳ AI dolgozik…';try{const r=await fetch(API+'/ai/chat',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({prompt:p,mode:'suggest'})});const d=await r.json();if(!r.ok)throw Error(d.error||'AI hiba');document.getElementById('out').textContent=d.answer||'Nincs válasz.'}catch(e){document.getElementById('out').textContent='❌ '+e.message}}</script></body></html>
