<!DOCTYPE html><html lang="hu"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="SANCI9517 követői mérföldkövek és közösségi célok."><title>Mérföldkövek | SANCI9517</title><link rel="stylesheet" href="style.css?v=20260904"><style>.mile-wrap{width:min(1100px,calc(100% - 36px));margin:auto;padding:10px 0 80px}.current{padding:30px;border:1px solid rgba(167,139,250,.2);border-radius:20px;background:linear-gradient(135deg,rgba(139,92,246,.12),rgba(255,255,255,.025));margin-bottom:24px}.current-top{display:flex;justify-content:space-between;gap:20px;align-items:end}.eyebrow{font-size:10px;font-weight:900;letter-spacing:2px;color:var(--purple-light)}.current h2{font-size:34px;margin:8px 0}.big-number{font-size:42px;font-weight:950}.bar{height:10px;background:#17171e;border-radius:99px;overflow:hidden;margin:22px 0 10px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--purple),var(--purple-light));border-radius:99px;transition:width .5s}.remain{color:var(--muted);font-size:12px}.mile-list{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.mile{padding:22px;border:1px solid rgba(255,255,255,.08);border-radius:16px;background:#0b0b10}.mile.done{border-color:rgba(167,139,250,.28)}.mile h3{margin:7px 0;font-size:22px}.mile p{margin:0;color:var(--muted);font-size:12px}.status{float:right;font-size:9px;font-weight:900;letter-spacing:1px;color:var(--muted)}.done .status{color:var(--purple-light)}@media(max-width:650px){.mile-list{grid-template-columns:1fr}.current-top{align-items:flex-start;flex-direction:column}.big-number{font-size:34px}}</style></head><body><header class="site-header"><div class="container nav"><a href="index.html" class="logo">SANCI<span>9517</span></a><button class="menu-toggle" id="menuToggle" type="button" aria-label="Menü" aria-expanded="false">☰</button><nav class="nav-links" id="navLinks"><a href="index.html">Főoldal</a><a href="hirek.html">Hírek</a><a href="szavazas.html">Szavazás</a><a href="clips.html">Clips</a><a href="menetrend.html">Menetrend</a><a href="twitch.html">Élő</a><a href="stats.html">Stats</a><a href="games.html">Játékok</a><a href="milestones.html" class="active">Mérföldkövek</a><a href="tamogatas.html">Támogatás</a><a href="setup.html">Setup</a><a href="partners.html">Partnerség</a><a href="discord.html">Közösség</a><a href="kapcsolat.html">Kapcsolat</a></nav></div></header><main><section class="page-header"><span>KÖZÖSSÉGI CÉLOK</span><h1>Mérföldkövek</h1><p>A SANCI9517 közösségi céljai és mérföldkövei.</p></section><div class="mile-wrap"><section class="current"><div class="current-top"><div><div class="eyebrow">KÖVETKEZŐ CÉL</div><h2 id="nextGoal">Betöltés…</h2><div class="remain" id="remaining">Adatok betöltése…</div></div><div class="big-number" id="followers">—</div></div><div class="bar"><i id="progress"></i></div><div class="remain" id="percent">—</div></section><section class="mile-list" id="mileList"></section></div></main><footer><div class="container"><span>SANCI9517</span><p>© 2026 Official Gaming Hub</p></div></footer><script>const goals=[100,500,1000,2500,5000,10000,25000];function render(v){const list=document.getElementById('mileList');list.innerHTML=goals.map(g=>{const done=v>=g;return `<article class="mile ${done?'done':''}"><span class="status">${done?'TELJESÍTVE':'CÉL'}</span><div class="eyebrow">KÖVETŐI CÉL</div><h3>${g.toLocaleString('hu-HU')} követő</h3><p>${done?'Ez a közösségi mérföldkő már megvan.':'Még '+Math.max(0,g-v).toLocaleString('hu-HU')+' követő szükséges.'}</p></article>`}).join('');const next=goals.find(g=>g>v)||goals[goals.length-1];document.getElementById('nextGoal').textContent=next.toLocaleString('hu-HU')+' követő';document.getElementById('remaining').textContent=v>=next?'A cél elérve!':'Még '+(next-v).toLocaleString('hu-HU')+' követő a következő mérföldkőig.';const prev=goals.filter(g=>g<=v).pop()||0;const pct=next===prev?100:Math.min(100,Math.max(0,(v-prev)/(next-prev)*100));document.getElementById('progress').style.width=pct+'%';document.getElementById('percent').textContent=Math.round(pct)+'% a következő cél felé';document.getElementById('followers').textContent=v.toLocaleString('hu-HU')}</script><script src="twitch-status.js?v=20260904"></script><script>document.addEventListener('sanci:twitch',e=>{const d=e.detail||{};const v=Number(d.followers||0);if(v)render(v)});document.addEventListener('sanci:twitch-error',()=>{document.getElementById('followers').textContent='—';document.getElementById('remaining').textContent='Az adatok jelenleg nem érhetők el.'});</script></body></html>
