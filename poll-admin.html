<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SANCI9517 | Szavazás kezelése</title><link rel="stylesheet" href="style.css?v=20260905"></head><body><main class="container" style="max-width:760px;padding-top:48px"><div class="page-header"><span>SANCI9517 ADMIN</span><h1>Szavazás kezelése</h1><p>Új szavazás indítása automatikusan lezárja az előzőt.</p></div><div class="support-box"><h2>Új szavazás</h2><label>Kérdés<br><input id="question" style="width:100%;margin:8px 0 16px;padding:12px" value="Melyik játék legyen a következő streamen?"></label><div id="options"></div><button id="save" class="btn btn-primary" type="button">Új szavazás indítása</button><p id="msg" style="margin-top:16px" aria-live="polite"></p></div></main><script>const API='https://sanci9517-twitch-api.sandor-bogadi95.workers.dev';const token=prompt('Admin token:');if(!token){document.body.innerHTML='<main class="container" style="padding:60px"><h1>Megszakítva</h1></main>';throw new Error('No token')}const defaults=[['fortnite','Fortnite','Battle Royale','🎯'],['hearthstone','Hearthstone','Stratégiai kártyajáték','🃏'],['egyeb','Egyéb','Más játék','🎮']];const box=document.getElementById('options');defaults.forEach(o=>{box.innerHTML+=`<label>${o[1]}<br><input data-id="${o[0]}" data-desc="${o[2]}" data-icon="${o[3]}" style="width:100%;margin:8px 0 16px;padding:12px" value="${o[1]}"></label>`});document.getElementById('save').onclick=async()=>{const msg=document.getElementById('msg'),question=document.getElementById('question').value.trim(),options=defaults.map(o=>({id:o[0],label:document.querySelector(`[data-id="${o[0]}"]`).value.trim(),description:o[2],icon:o[3]})).filter(o=>o.label);if(!question||!options.length){msg.textContent='⚠️ Add meg a kérdést és legalább egy választ.';return}const b=document.getElementById('save');b.disabled=true;try{const r=await fetch(API+'/poll/admin',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({question,options})}),data=await r.json();if(!r.ok)throw new Error(data.error||'Hiba');msg.textContent='✅ Az új szavazás elindult, az előző lezárva.'}catch(e){msg.textContent='⚠️ '+e.message}finally{b.disabled=false}};</script></body></html>
