<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SANCI9517 | Szavazás kezelése</title><link rel="stylesheet" href="style.css?v=20260905"></head><body><main class="container" style="max-width:760px;padding-top:48px"><div class="page-header"><span>SANCI9517 ADMIN</span><h1>Szavazás kezelése</h1><p>Itt indíthatsz új szavazást és nullázhatod az eredményeket.</p></div><div class="support-box"><h2>Új szavazás</h2><label>Kérdés<br><input id="question" style="width:100%;margin:8px 0 16px;padding:12px" value="Melyik játék legyen a következő streamen?"></label><div id="options"></div><button id="save" class="btn btn-primary" type="button">Új szavazás indítása</button><p id="msg" style="margin-top:16px"></p></div></main><script>const ADMIN_KEY='sanci9517_poll_admin';const key=prompt('Admin kulcs:');if(key!==ADMIN_KEY){document.body.innerHTML='<main class="container" style="padding:60px"><h1>Hozzáférés megtagadva</h1><p>Helytelen admin kulcs.</p></main>';throw new Error('Unauthorized')}const options=[['fortnite','Fortnite','Battle Royale','🎯'],['hearthstone','Hearthstone','Stratégiai kártyajáték','🃏'],['egyeb','Egyéb','Más játék','🎮']];const box=document.getElementById('options');options.forEach(o=>{box.innerHTML+=`<label>${o[1]}<br><input data-id="${o[0]}" data-desc="${o[2]}" data-icon="${o[3]}" style="width:100%;margin:8px 0 16px;padding:12px" value="${o[1]}"></label>`});document.getElementById('save').onclick=async()=>{const config={version:1,active:true,id:'poll-'+Date.now(),question:document.getElementById('question').value.trim(),options:options.map(o=>({id:o[0],label:document.querySelector(`[data-id="${o[0]}"]`).value.trim(),description:o[2],icon:o[3]}))};localStorage.setItem('sanci9517_admin_pending_poll',JSON.stringify(config));document.getElementById('msg').textContent='Az új szavazás beállítása elkészült. Fontos: GitHub Pages önmagában nem tudja központilag menteni a szavazatokat.'};</script></body></html>
