<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Sanci9517 — Admin belépés</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; font-family: system-ui, sans-serif; background: #0b0b10; color: #f5f5f7; }
      main { width: min(100%, 420px); padding: 28px; border: 1px solid #292933; border-radius: 18px; background: #14141b; box-sizing: border-box; }
      h1 { margin: 0 0 8px; }
      p { color: #a9a9b3; }
      label { display: block; margin: 18px 0 7px; font-weight: 600; }
      input { width: 100%; box-sizing: border-box; padding: 12px 14px; border: 1px solid #383842; border-radius: 10px; background: #0d0d12; color: inherit; font: inherit; }
      button { width: 100%; margin-top: 22px; padding: 12px 14px; border: 0; border-radius: 10px; font: inherit; font-weight: 700; cursor: pointer; }
      button:disabled { cursor: wait; opacity: .65; }
      #result { min-height: 24px; margin-top: 16px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Admin belépés</h1>
      <p>Sanci9517 vezérlőfelület</p>
      <form id="login-form">
        <label for="email">E-mail</label>
        <input id="email" type="email" autocomplete="username" required>
        <label for="password">Jelszó</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button id="submit" type="submit">Belépés</button>
      </form>
      <div id="result" role="alert" aria-live="polite"></div>
    </main>
    <script>
      const form = document.getElementById("login-form");
      const result = document.getElementById("result");
      const submit = document.getElementById("submit");
      async function waitForAuthenticatedSession() {
        for (let attempt = 0; attempt < 3; attempt += 1) {
          try {
            const response = await fetch("/api/auth/session", {
              method: "GET",
              credentials: "same-origin",
              cache: "no-store",
              headers: { "Accept": "application/json" }
            });
            const payload = await response.json();
            if (response.ok && payload?.ok && payload?.data?.authenticated === true) return true;
          } catch {}
          if (attempt < 2) await new Promise((resolve) => window.setTimeout(resolve, 200 * (attempt + 1)));
        }
        return false;
      }
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        result.textContent = "Belépés...";
        submit.disabled = true;
        try {
          const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "same-origin",
            body: JSON.stringify({
              email: document.getElementById("email").value,
              password: document.getElementById("password").value
            })
          });
          const data = await response.json();
          if (!response.ok || !data.ok) {
            result.textContent = data?.error?.message || "Sikertelen bejelentkezés.";
            return;
          }
          result.textContent = "Belépés sikeres, munkamenet ellenőrzése…";
          const sessionReady = await waitForAuthenticatedSession();
          if (!sessionReady) {
            result.textContent = "A belépés sikerült, de a munkamenet nem igazolható. A böngésző nem küldte vissza a munkamenetet; próbáld újra, vagy nyisd meg a webhelyet normál Chrome-lapon.";
            return;
          }
          window.location.replace("/admin");
        } catch {
          result.textContent = "A bejelentkezés nem sikerült. Próbáld újra.";
        } finally {
          submit.disabled = false;
        }
      });
    </script>
  </body>
</html>
