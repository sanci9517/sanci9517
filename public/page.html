</style>

<body>
<header class="site-header"><div class="wrap nav"><a class="brand" href="/"><span class="brand-mark">S</span><span data-site-name>Sanci9517</span></a><div class="nav-actions"><button class="menu-button" data-menu-button type="button" aria-label="Menü" aria-expanded="false">☰</button></div></div><nav class="menu-panel" data-menu-panel aria-label="Fő navigáció"><div class="menu-grid"><a class="menu-link" href="/twitch.html">🎮 Élő adás<small>Twitch</small></a><a class="menu-link" href="/schedule.html">📅 Adásrend<small>Időpontok</small></a><a class="menu-link" href="/youtube.html">▶ YouTube<small>Videók</small></a><a class="menu-link" href="/tiktok.html">♪ TikTok<small>Rövid klipek</small></a><a class="menu-link" href="/vod.html">🎬 VOD<small>Legjobb pillanatok</small></a><a class="menu-link" href="/community.html">👥 Közösség<small>Discord</small></a><a class="menu-link" href="/about.html">◉ Rólam<small>Sanci9517</small></a><a class="menu-link" href="/contact.html">✉ Kapcsolat<small>Elérhetőség</small></a></div></nav></header>
<main class="page"><div class="wrap content-page"><section class="content-hero"><div class="content-eyebrow">Sanci9517 • Tartalom</div><h1 id="page-title" class="content-title">Betöltés...</h1><p id="page-description" class="content-description"></p></section><section id="content-card" class="content-card" aria-live="polite"><p class="content-text">A tartalom betöltése folyamatban...</p></section><a class="content-back" href="/">← Vissza a főoldalra</a></div></main>
<footer class="footer"><div class="wrap footer-row"><span>© <span data-year></span> <span data-site-name>Sanci9517</span></span><span class="kicker">Streamer • Gaming • Közösség</span></div></footer>
<script src="/assets/site.js"></script>
<script>
const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const safeUrl=v=>{try{const u=new URL(String(v),location.origin);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return''}};
async function loadPage(){
  const slug=decodeURIComponent(location.pathname.replace(/^\/p\//,'').split('/')[0]||'').trim();
  const title=document.getElementById('page-title'),desc=document.getElementById('page-description'),card=document.getElementById('content-card');
  if(!slug){title.textContent='Hiányzó oldal';card.innerHTML='<div class="content-error"><h1>Hiányzó oldal</h1><p>Nem adtál meg oldalazonosítót.</p></div>';return}
  try{
    const r=await fetch('/api/public/pages?slug='+encodeURIComponent(slug),{cache:'no-store'});
    const payload=await r.json();
    if(!r.ok||!payload.ok)throw new Error('not-found');
    const p=payload.data||{},c=p.content||{};
    document.title=(p.title||'Sanci9517')+' — Sanci9517';
    title.textContent=p.title||'Sanci9517';
    desc.textContent=p.description||'';
    let html='';
    const image=safeUrl(c.image);
    if(image)html+='<img class="content-image" src="'+esc(image)+'" alt="">';
    if(typeof c.headline==='string'&&c.headline.trim())html+='<h2 class="content-headline">'+esc(c.headline)+'</h2>';
    if(typeof c.text==='string'&&c.text.trim())html+='<div class="content-text">'+esc(c.text)+'</div>';
    const buttonUrl=safeUrl(c.buttonUrl),buttonText=typeof c.buttonText==='string'&&c.buttonText.trim()?c.buttonText:'Megnyitás';
    if(buttonUrl)html+='<a class="content-button" href="'+esc(buttonUrl)+'" target="_blank" rel="noopener noreferrer">'+esc(buttonText)+' ↗</a>';
    if(!html)html='<div class="content-text">Az oldal létrejött, de még nincs megjeleníthető tartalma.</div>';
    card.innerHTML=html;
  }catch(e){
    title.textContent='Az oldal nem található';desc.textContent='';card.innerHTML='<div class="content-error"><h1>404</h1><p>Ez az oldal nem létezik, vagy nincs publikálva.</p></div>';
  }
}
loadPage();
</script>
