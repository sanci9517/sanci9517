<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>Sanci9517 — Admin</title>
    <style>
      body { margin: 0; min-height: 100vh; font-family: system-ui, sans-serif; background: #0b0b10; color: #f5f5f7; }
      header { padding: 22px 24px; border-bottom: 1px solid #292933; background: #14141b; }
      main { width: min(1100px, calc(100% - 32px)); margin: 32px auto; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
      .card { padding: 20px; border: 1px solid #292933; border-radius: 16px; background: #14141b; }
      .muted { color: #a9a9b3; }
      button { padding: 10px 14px; border: 0; border-radius: 9px; font: inherit; font-weight: 700; cursor: pointer; }
      @media (max-width: 600px) { main { margin: 20px auto; } }
    </style>
  </head>
  <body>
    <header><strong>Sanci9517 Admin</strong></header>
    <main>
      <h1>Vezérlőpult</h1>
      <p id="welcome" class="muted">Session ellenőrzése...</p>
      <div class="grid">
        <section class="card"><h2>Tartalom</h2><p class="muted">Oldalak és webhelytartalom kezelése.</p></section>
        <section class="card"><h2>Adásrend</h2><p class="muted">Stream időpontok kezelése.</p></section>
        <section class="card"><h2>Social</h2><p class="muted">Twitch, TikTok, YouTube és Discord.</p></section>
        <section class="card"><h2>Beállítások</h2><p class="muted">A webhely központi beállításai.</p></section>
      </div>
      <button id="logout" type="button">Kijelentkezés</button>
    </main>
    <script>
      const welcome = document.getElementById("welcome");
      const logout = document.getElementById("logout");
      async function loadSession() {
        try {
          const response = await fetch("/api/auth/session", { credentials: "same-origin", cache: "no-store" });
          const data = await response.json();
          if (!response.ok || !data.ok || !data.data?.authenticated) {
            window.location.replace("/admin/login");
            return;
          }
          welcome.textContent = `Bejelentkezve: ${data.data.user.displayName} (${data.data.user.role})`;
        } catch {
          window.location.replace("/admin/login");
        }
      }
      logout.addEventListener("click", async () => {
        await fetch("/api/auth/logout", { method: "POST", credentials: "same-origin" });
        window.location.replace("/admin/login");
      });
      loadSession();
    </script>
  </body>
</html>
