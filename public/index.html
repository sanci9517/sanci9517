<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sanci9517 — Streamer</title>
  </head>
  <body>
    <main>
      <h1 id="site-name">Sanci9517</h1>
      <p id="site-tagline">Streamer</p>
    </main>

    <script>
      async function loadSiteSettings() {
        try {
          const response = await fetch('/api/public/site-settings', {
            headers: { 'Accept': 'application/json' },
            cache: 'no-store'
          });

          if (!response.ok) return;

          const settings = await response.json();
          if (typeof settings.siteName === 'string' && settings.siteName.trim()) {
            document.getElementById('site-name').textContent = settings.siteName.trim();
            document.title = settings.siteName.trim() + ' — Streamer';
          }
          if (typeof settings.tagline === 'string') {
            document.getElementById('site-tagline').textContent = settings.tagline;
          }
        } catch {
          // Keep safe static defaults when the public settings API is unavailable.
        }
      }

      loadSiteSettings();
    </script>
  </body>
</html>
