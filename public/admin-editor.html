<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sanci9517 — Oldalszerkesztő</title>
<link rel="stylesheet" href="/assets/page-builder.css">
</head>
<body class="pb-app">
<header class="pb-top"><div class="pb-brand">Sanci9517 · Oldalszerkesztő <span id="pb-dirty" class="pb-muted"></span></div><div class="pb-top-actions"><button id="pb-desktop" class="pb-btn" type="button">🖥 Asztali</button><button id="pb-mobile" class="pb-btn" type="button">📱 Mobil</button><button id="pb-inspector-toggle" class="pb-btn" type="button">Tulajdonságok</button><button id="pb-back" class="pb-btn" type="button">← Vissza</button><button id="pb-save" class="pb-btn primary" type="button">Mentés</button></div></header>
<div class="pb-layout">
<aside class="pb-sidebar"><div class="pb-title">Oldal adatai</div><div class="pb-field"><label for="page-title">Cím</label><input id="page-title" maxlength="160"></div><div class="pb-field"><label for="page-slug">Slug</label><input id="page-slug" maxlength="80" placeholder="pl. bemutatkozas"></div><div class="pb-field"><label for="page-description">Leírás</label><textarea id="page-description" maxlength="500"></textarea></div><label class="pb-field"><input id="page-published" type="checkbox" checked> Publikált oldal</label><div class="pb-title" style="margin-top:24px">Elemek</div><div id="pb-palette" class="pb-palette">
<button type="button" data-type="section">▣ <span>Szakasz<small>Teljes tartalmi blokk</small></span></button>
<button type="button" data-type="card">▤ <span>Box / kártya<small>Több tartalom egy dobozban</small></span></button>
<button type="button" data-type="columns">▥ <span>Oszlopok<small>1–4 oszlop</small></span></button>
<button type="button" data-type="heading">H <span>Címsor<small>1–6 szint</small></span></button>
<button type="button" data-type="text">T <span>Szöveg<small>Bekezdés / leírás</small></span></button>
<button type="button" data-type="image">▧ <span>Kép<small>URL alapú kép</small></span></button>
<button type="button" data-type="button">→ <span>Gomb<small>CTA / link</small></span></button>
<button type="button" data-type="divider">— <span>Elválasztó<small>Vizuális tagolás</small></span></button>
<button type="button" data-type="spacer">↕ <span>Térköz<small>Üres hely</small></span></button>
<button type="button" data-type="embed">◇ <span>Beágyazás<small>Hely későbbi embedeknek</small></span></button>
</div><p class="pb-muted" style="margin-top:16px">Tipp: jelölj ki egy boxot vagy szakaszt, majd adj hozzá elemet. Így egy boxon belül többféle tartalom építhető.</p></aside>
<main class="pb-canvas-wrap"><div id="pb-device" class="pb-device"><div id="pb-canvas" class="pb-canvas"></div></div></main>
<aside id="pb-inspector" class="pb-inspector"><div class="pb-title">Tulajdonságok</div><div class="pb-inspector-empty">Kattints egy elemre a vásznon.</div></aside>
</div>
<div id="pb-status" class="pb-toast"></div>
<script src="/assets/page-builder.js"></script>
</body></html>
