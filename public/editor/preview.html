<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sanci9517 — Előnézet</title><style>body{margin:0;background:#f7f8fa;color:#17202b;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1080px;margin:0 auto;padding:48px 24px}.preview-node{box-sizing:border-box}.preview-section{border-radius:14px}.preview-button{display:inline-flex;padding:12px 18px;border-radius:10px;background:#17202b;color:#fff;text-decoration:none}.preview-image{max-width:100%;display:block;border-radius:12px}.error{text-align:center;padding:80px 20px}</style></head><body><main class="wrap"><div id="page">Betöltés…</div></main><script>const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const url=v=>{try{const u=new URL(String(v||''),location.origin);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return''}};function node(n){if(!n||n.visible===false)return'';const l=n.layout||{},s=n.style||{},a=n.attributes||{};const st=`width:${Math.max(20,Number(l.width)||300)}px;min-height:${Math.max(20,Number(l.height)||80)}px;padding:${Math.max(0,Number(l.padding)||0)}px;color:${esc(s.color||'inherit')};background:${esc(s.background||'transparent')};font-size:${Math.max(8,Number(s.fontSize)||16)}px;font-weight:${Number(s.fontWeight)||400};line-height:${Number(s.lineHeight)||1.4};text-align:${esc(s.textAlign||'left')};border:${esc(s.border||'none')};border-radius:${Math.max(0,Number(s.radius)||0)}px;opacity:${Math.max(0,Math.min(1,Number(s.opacity)??1))};box-sizing:border-box;margin-bottom:12px`;const text=esc(n.content?.text??n.name??'');const ch=(n.children||[]).map(node).join('');switch(n.type){case'heading':return `<h2 class="preview-node" style="${st}">${text}</h2>`;case'text':case'paragraph':case'richtext':return `<div class="preview-node" style="${st}">${text}</div>`;case'button':case'submit':{const u=url(a.href);return u?`<div class="preview-node" style="${st}"><a class="preview-button" href="${u}">${text}</a></div>`:`<div class="preview-button">${text}</div>`}case'image':{const u=url(a.src);return u?`<img class="preview-image" src="${u}" alt="${esc(a.alt||'')}" style="${st}">`:`<div style="${st}">Kép</div>`}case'divider':return'<hr>';case'spacer':return `<div style="height:${Math.max(0,Number(l.height)||40)}px"></div>`;default:return `<section class="preview-section" style="${st}">${ch||`<b>${text}</b>`}</section>`}}async function load(){const id=new URLSearchParams(location.search).get('pageId');const root=document.getElementById('page');if(!id){root.innerHTML='<div class="error"><h1>Hiányzó oldal</h1></div>';return}try{const r=await fetch('/api/admin/editor?pageId='+encodeURIComponent(id),{credentials:'include',cache:'no-store'});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error?.message||'Előnézet nem tölthető be');const p=j.data.page,d=p.document||{};document.title=(p.title||'Sanci9517')+' — Előnézet';root.innerHTML=`<h1>${esc(p.title||'Sanci9517')}</h1>${esc(p.description||'')?`<p>${esc(p.description)}</p>`:''}${d.root?.children?.map(node).join('')||'<p>Az oldalnak nincs tartalma.</p>'}`}catch(e){root.innerHTML='<div class="error"><h1>Előnézet hiba</h1><p>'+esc(e.message)+'</p></div>'}}load();</script></body></html>
