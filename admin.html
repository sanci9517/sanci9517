<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SANCI9517 Admin 2.0</title><link rel="stylesheet" href="admin.css?v=4"></head><body><div id="loginPanel" class="login"><div class="box"><h1>⚙ SANCI9517 Admin</h1><p class="muted">A teljes oldal tartalma egy helyen kezelhető.</p><label class="label">JELSZÓ</label><input id="pass" class="input" type="password" placeholder="Admin jelszó"><div style="height:10px"></div><button id="loginBtn" class="btn primary" style="width:100%">BELÉPÉS</button><p id="err" class="muted"></p></div></div><main id="app" class="admin-wrap" hidden><header class="top"><div><h1>SANCI9517 Admin 2.0</h1><span class="muted">Főoldal · Twitch · Játékok · Menetrend · Hírek · Clips · Célok · Közösség</span></div><div class="actions"><a class="btn" href="index.html">Oldal</a><button id="save" class="btn primary">MENTÉS</button><button id="logout" class="btn danger">Kilépés</button></div></header><div class="stats"><div class="stat"><small>TWITCH</small><b id="tstatus">—</b></div><div class="stat"><small>JÁTÉK</small><b id="tgame">—</b></div><div class="stat"><small>MANUÁLIS MÓD</small><b id="manual">—</b></div><div class="stat"><small>CÉL</small><b id="goal">—</b></div></div><nav class="nav"><button class="btn" data-tab="home">🏠 Főoldal</button><button class="btn" data-tab="twitch">🔴 Twitch</button><button class="btn" data-tab="games">🎮 Játékok</button><button class="btn" data-tab="schedule">📅 Menetrend</button><button class="btn" data-tab="news">✦ Hírek</button><button class="btn" data-tab="clips">▶ Clips</button><button class="btn" data-tab="goal">↗ Célok</button><button class="btn" data-tab="social">♧ Közösség</button><button class="btn" data-tab="backup">💾 Mentés</button><a class="btn" href="admin-ai.html">🤖 SANCI AI</a></nav><section id="editor"></section></main><div id="toast" class="toast" hidden></div><script>
const API='https://sanci9517-twitch-api.sandor-bogadi95.workers.dev';let token=sessionStorage.getItem('sanci_admin_session'),cfg=null;const $=s=>document.querySelector(s);const esc=x=>String(x??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[m]));
async function load(){try{cfg=await (await fetch('config.json?v='+Date.now())).json()}catch{cfg={}}try{const x=JSON.parse(localStorage.getItem('sanci_site_config')||'null');if(x)cfg={...cfg,...x,social:{...(cfg.social||{}),...(x.social||{})},manualLive:{...(cfg.manualLive||{}),...(x.manualLive||{})},nextStream:{...(cfg.nextStream||{}),...(x.nextStream||{})},milestone:{...(cfg.milestone||{}),...(x.milestone||{})}}}catch{}render('home');twitch()}
async function twitch(){try{const r=await fetch(API+'/twitch/stats',{headers:token?{Authorization:'Bearer '+token}:{}});const d=await r.json();$('#tstatus').textContent=d.live?'🔴 ÉLŐ':'Offline';$('#tgame').textContent=d.game_name||'—'}catch{$('#tstatus').textContent='Nincs kapcsolat';$('#tgame').textContent=cfg.manualLive?.game||'—'}$('#manual').textContent=cfg.manualLive?.enabled?'BE':'KI';$('#goal').textContent=(cfg.milestone?.current||0)+' / '+(cfg.milestone?.target||0)}
function field(label,key,val,type='text'){return `<label class="label">${label}<input class="input" data-key="${key}" type="${type}" value="${esc(val)}"></label>`}function area(label,key,val){return `<label class="label">${label}<textarea class="textarea" data-key="${key}">${esc(val)}</textarea></label>`}
function render(tab){let e='';if(tab==='home')e=`<div class="grid"><section class="section"><h2>Főoldal</h2><div class="form">${field('Márkanév','brand',cfg.brand)}${field('Fő cím','tagline',cfg.tagline)}${area('Bemutatkozó szöveg','intro',cfg.intro)}${field('Twitch link','social.twitch',cfg.social?.twitch||'')}${field('YouTube link','social.youtube',cfg.social?.youtube||'')}${field('TikTok link','social.tiktok',cfg.social?.tiktok||'')}${field('Discord link','social.discord',cfg.social?.discord||'')}</div></section><section class="section"><h2>Következő stream</h2><div class="form">${field('Dátum / nap','nextStream.date',cfg.nextStream?.date||'')}${field('Idő','nextStream.time',cfg.nextStream?.time||'')}${field('Játék','nextStream.game',cfg.nextStream?.game||'')}${field('Cím','nextStream.title',cfg.nextStream?.title||'')}</div></section></div>`;
if(tab==='twitch')e=`<div class="grid"><section class="section"><h2>Twitch automata + tartalék mód</h2><p class="muted">Ha az API működik, az automata adat jelenik meg. Hiba esetén a kézi adatok veszik át a helyét.</p><div class="form"><label class="label">Kézi tartalék bekapcsolva <input id="men" type="checkbox" ${cfg.manualLive?.enabled?'checked':''}></label><label class="label">Kézi élő állapot <input id="mlive" type="checkbox" ${cfg.manualLive?.live===true?'checked':''}></label>${field('Játék','manualLive.game',cfg.manualLive?.game||'Fortnite')}${field('Stream cím','manualLive.title',cfg.manualLive?.title||'')}${field('Nézők','manualLive.viewers',cfg.manualLive?.viewers||0,'number')}</div></section></div>`;
if(tab==='games')e=`<section class="section"><h2>Játékok</h2><div id="items">${cfg.games.map((g,i)=>`<div class="item"><div><b>${esc(g.name)}</b><br><small>${esc(g.description)}</small></div><button class="btn danger" onclick="del('games',${i})">Törlés</button></div>`).join('')}</div><div class="form" style="margin-top:15px">${field('Játék neve','newName','')}${area('Leírás','newDesc','')}<button class="btn primary" onclick="addGame()">+ Játék hozzáadása</button></div></section>`;
if(tab==='schedule')e=`<section class="section"><h2>Menetrend</h2><div id="items">${cfg.schedule.map((x,i)=>`<div class="item"><div><b>${esc(x.day)} ${esc(x.time)}</b><br><small>${esc(x.game)} • ${esc(x.title)}</small></div><button class="btn danger" onclick="del('schedule',${i})">Törlés</button></div>`).join('')}</div><div class="form" style="margin-top:15px"><div class="row">${field('Nap','newDay','')}${field('Idő','newTime','')}</div><div class="row">${field('Játék','newGame','')}${field('Cím','newTitle','')}</div><button class="btn primary" onclick="addSchedule()">+ Időpont hozzáadása</button></div></section>`;
if(tab==='news')e=`<section class="section"><h2>Hírek</h2><div id="items">${cfg.news.map((x,i)=>`<div class="item"><div><b>${esc(x.title)}</b><br><small>${esc(x.date)} • ${esc(x.body)}</small></div><button class="btn danger" onclick="del('news',${i})">Törlés</button></div>`).join('')}</div><div class="form" style="margin-top:15px">${field('Cím','newTitle','')}${area('Szöveg','newBody','')}<button class="btn primary" onclick="addNews()">+ Hír hozzáadása</button></div></section>`;
if(tab==='clips')e=`<section class="section"><h2>Clips</h2><div id="items">${cfg.clips.map((x,i)=>`<div class="item"><div><b>${esc(x.title)}</b><br><small>${esc(x.url)}</small></div><button class="btn danger" onclick="del('clips',${i})">Törlés</button></div>`).join('')}</div><div class="form" style="margin-top:15px">${field('Cím','newTitle','')}${field('Clip URL','newUrl','')}<button class="btn primary" onclick="addClip()">+ Clip hozzáadása</button></div></section>`;
if(tab==='goal')e=`<section class="section"><h2>Közösségi cél</h2><div class="form">${field('Cím','milestone.label',cfg.milestone?.label||'Következő cél')}${field('Jelenlegi érték','milestone.current',cfg.milestone?.current||0,'number')}${field('Célérték','milestone.target',cfg.milestone?.target||5000,'number')}${area('Leírás','milestone.description',cfg.milestone?.description||'')}</div></section>`;
if(tab==='social')e=`<section class="section"><h2>Közösségi linkek</h2><div class="form">${field('Twitch','social.twitch',cfg.social?.twitch||'')}${field('YouTube','social.youtube',cfg.social?.youtube||'')}${field('TikTok','social.tiktok',cfg.social?.tiktok||'')}${field('Discord','social.discord',cfg.social?.discord||'')}${field('Instagram','social.instagram',cfg.social?.instagram||'')}${field('Támogatás','social.support',cfg.social?.support||'')}</div></section>`;
if(tab==='backup')e=`<section class="section"><h2>Mentés / visszaállítás</h2><p class="muted">A beállítások a böngészőben tárolódnak. Exportáld a JSON-t, ha másik gépre is át akarod vinni.</p><div class="actions"><button class="btn primary" onclick="download()">JSON export</button><label class="btn">JSON import <input id="imp" type="file" accept="application/json" hidden></label></div><textarea id="raw" class="textarea" style="margin-top:15px;min-height:300px">${esc(JSON.stringify(cfg,null,2))}</textarea><button class="btn primary" style="margin-top:10px" onclick="importText()">JSON betöltése</button></section>`;
$('#editor').innerHTML=e;document.querySelectorAll('[data-key]').forEach(x=>x.oninput=()=>setKey(x.dataset.key,x.type==='number'?Number(x.value):x.value));if($('#men'))$('#men').onchange=e=>cfg.manualLive.enabled=e.target.checked;if($('#mlive'))$('#mlive').onchange=e=>cfg.manualLive.live=e.target.checked;if($('#imp'))$('#imp').onchange=async e=>{try{cfg=JSON.parse(await e.target.files[0].text());save();render('backup')}catch{toast('Hibás JSON')}}}
function setKey(path,val){const p=path.split('.');let o=cfg;for(let i=0;i<p.length-1;i++){if(!o[p[i]])o[p[i]]={};o=o[p[i]]}o[p[p.length-1]]=val}
function del(k,i){cfg[k].splice(i,1);render(k==='games'?'games':k==='schedule'?'schedule':k==='news'?'news':'clips')}function v(k){return document.querySelector(`[data-key="${k}"]`)?.value||''}function addGame(){if(!v('newName'))return;cfg.games.push({name:v('newName'),description:v('newDesc'),active:true});render('games')}function addSchedule(){if(!v('newDay'))return;cfg.schedule.push({day:v('newDay'),time:v('newTime'),game:v('newGame'),title:v('newTitle'),active:true});render('schedule')}function addNews(){if(!v('newTitle'))return;cfg.news.unshift({title:v('newTitle'),body:v('newBody'),date:new Date().toISOString().slice(0,10),active:true});render('news')}function addClip(){if(!v('newUrl'))return;cfg.clips.push({title:v('newTitle'),url:v('newUrl')});render('clips')}
function save(){localStorage.setItem('sanci_site_config',JSON.stringify(cfg));toast('Mentve. A nyilvános oldal ezen a böngészőn azonnal az új adatokat használja.');twitch()}function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,3000)}function download(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(cfg,null,2)],{type:'application/json'}));a.download='sanci-site-config.json';a.click()}function importText(){try{cfg=JSON.parse($('#raw').value);save();render('backup')}catch{toast('Hibás JSON')}}
async function auth(){if(token){$('#loginPanel').hidden=true;$('#app').hidden=false;load();return}$('#loginBtn').onclick=async()=>{const p=$('#pass').value.trim();if(!p)return;try{const r=await fetch(API+'/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})});const d=await r.json();if(!r.ok)throw Error(d.error||'Hibás jelszó');token=d.token;sessionStorage.setItem('sanci_admin_session',token);$('#loginPanel').hidden=true;$('#app').hidden=false;load()}catch(e){$('#err').textContent='❌ '+e.message+' — A Twitch/Worker kapcsolat nélkül a biztonságos admin-hitelesítés nem érhető el.'}}}
window.addEventListener('beforeunload',()=>cfg&&localStorage.setItem('sanci_site_config',JSON.stringify(cfg)));document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>render(b.dataset.tab));$('#save').onclick=save;$('#logout').onclick=()=>{sessionStorage.removeItem('sanci_admin_session');location.reload()};auth();</script></body></html>
