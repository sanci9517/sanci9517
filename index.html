<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SANCI9517 | Official Streamer Hub</title>
  
  <!-- ==========================================
     [SECTION 1: BETŰTÍPUSOK ÉS IKONOK]
     ========================================== -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- ==========================================
     [SECTION 2: CSS STÍLUSOK (DIZÁJN)]
     ========================================== -->
  <style>
    /* --- 2.1 STÍLUS VÁLTOZÓK & ALAPBEÁLLÍTÁSOK --- */
    :root {
      --bg-dark: #06040a;
      --card-bg: rgba(18, 10, 32, 0.75);
      --accent-purple: #a855f7;
      --glow-purple: #c084fc;
      --border-purple: rgba(168, 85, 247, 0.3);
      --text-main: #ffffff;
      --text-sub: #a78bfa;
    }

    [data-theme="green"] {
      --accent-purple: #10b981;
      --glow-purple: #34d399;
      --border-purple: rgba(16, 185, 129, 0.3);
      --card-bg: rgba(6, 30, 22, 0.75);
      --text-sub: #6ee7b7;
    }

    [data-theme="blue"] {
      --accent-purple: #3b82f6;
      --glow-purple: #60a5fa;
      --border-purple: rgba(59, 130, 246, 0.3);
      --card-bg: rgba(10, 22, 40, 0.75);
      --text-sub: #93c5fd;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(168, 85, 247, 0.18) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(59, 130, 246, 0.15) 0%, transparent 40%);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px 80px 15px;
    }

    /* --- 2.2 GLASSMORPHISM & ELEMEK KINÉZETE --- */
    header, .card-btn {
      background: var(--card-bg) !important;
      border: 1px solid var(--border-purple) !important;
      backdrop-filter: blur(16px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(16px) saturate(180%) !important;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37) !important;
    }

    header {
      border-radius: 20px;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .brand { display: flex; align-items: center; gap: 15px; }
    .avatar { 
      width: 60px; 
      height: 60px; 
      border-radius: 50%; 
      border: 2px solid var(--accent-purple); 
      box-shadow: 0 0 15px var(--accent-purple); 
    }
    .brand-text h1 { 
      font-family: 'Orbitron', sans-serif; 
      font-size: 1.4rem; 
      letter-spacing: 1.5px; 
      background: linear-gradient(to right, #fff, var(--text-sub));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-text p { font-size: 0.85rem; color: var(--text-sub); font-weight: 600; }

    .theme-switcher { 
      display: flex; 
      gap: 10px; 
      background: rgba(0,0,0,0.4); 
      border: 1px solid var(--border-purple); 
      padding: 8px 12px; 
      border-radius: 20px; 
    }
    .dot { width: 14px; height: 14px; border-radius: 50%; cursor: pointer; }
    .dot:hover { transform: scale(1.2); }
    .dot.purple { background: #a855f7; box-shadow: 0 0 8px #a855f7; }
    .dot.green { background: #10b981; box-shadow: 0 0 8px #10b981; }
    .dot.blue { background: #3b82f6; box-shadow: 0 0 8px #3b82f6; }

    /* --- 2.3 LINK GOMBOK --- */
    .section-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      color: var(--text-sub);
      letter-spacing: 2px;
      margin-top: 10px;
      margin-bottom: 5px;
      text-transform: uppercase;
      grid-column: 1 / -1;
    }

    .card-btn {
      border-radius: 14px;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: white;
      font-weight: 700;
      font-size: 1.1rem;
    }
    .card-btn:hover { 
      border-color: var(--glow-purple) !important; 
      transform: translateY(-3px) scale(1.01) !important; 
      box-shadow: 0 0 20px var(--border-purple) !important;
    }
    .card-left { display: flex; align-items: center; gap: 16px; }
    .card-left i { font-size: 1.5rem; color: var(--accent-purple); width: 25px; text-align: center; }

  /* ============================================================
       [SECTION 2.4: DESKTOP (WEB) BENTO GRID DASHBOARD]
       ============================================================ */
    @media (min-width: 900px) {
      body {
        padding: 50px 20px;
        background-color: #06040a;
        background-image: 
          radial-gradient(circle at 20% 20%, rgba(168, 85, 247, 0.15) 0%, transparent 40%),
          radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.12) 0%, transparent 40%);
        background-attachment: fixed;
      }

      /* STRUKTURÁLT BENTO GRID (KÖZÉPRE ZÁRT, MATEMATIKAI ARÁNYOK) */
      .main-container {
        width: 100%;
        max-width: 1100px;
        display: grid;
        grid-template-columns: 320px 1fr 1fr;
        grid-template-rows: auto auto auto;
        gap: 20px;
        align-items: stretch;
      }

      /* BAL OLDAL: PROFIL PANEL (3 SOR MAGAS) */
      header {
        grid-column: 1 / 2;
        grid-row: 1 / 4;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        text-align: center;
        padding: 40px 24px;
        background: rgba(18, 10, 32, 0.85) !important;
        border: 1px solid rgba(168, 85, 247, 0.3) !important;
        border-radius: 24px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5) !important;
      }

      .brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      .avatar {
        width: 120px;
        height: 120px;
        border: 3px solid var(--accent-purple);
        box-shadow: 0 0 25px rgba(168, 85, 247, 0.4);
      }

      .brand-text h1 {
        font-size: 1.8rem;
        letter-spacing: 2px;
      }

      .brand-text p {
        font-size: 0.85rem;
        color: var(--text-sub);
        font-weight: 700;
        letter-spacing: 1px;
      }

      .stats-badge {
        width: 100%;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 15px;
        border-radius: 16px;
        margin-top: 20px;
      }

      /* TARTALOM REGGELIZŐ BLOKKOK (JOBB OLDAL BENTO MATRIX) */
      .links-wrapper {
        display: contents; /* A gombok közvetlenül beleilleszkednek a fő gridbe */
      }

      .section-title {
        grid-column: 2 / 4;
        font-size: 0.85rem;
        letter-spacing: 3px;
        color: var(--text-sub);
        margin: 0;
        align-self: end;
      }

      /* KIEMELT STREAM BANNER (DUPLA SZÉLES CSEMPEMÁTRIXBAN) */
      .hero-card {
        grid-column: 2 / 4;
        background: linear-gradient(135deg, rgba(168, 85, 247, 0.25), rgba(18, 10, 32, 0.9));
        border: 1px solid var(--accent-purple);
        border-radius: 20px;
        padding: 28px 32px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
      }

      .hero-card h2 {
        font-family: 'Orbitron', sans-serif;
        font-size: 1.3rem;
        margin-bottom: 6px;
      }

      .hero-card p {
        color: var(--text-sub);
        font-size: 0.9rem;
      }

      .play-btn {
        background: var(--accent-purple);
        color: #000;
        font-family: 'Orbitron', sans-serif;
        font-weight: 900;
        font-size: 0.85rem;
        padding: 14px 24px;
        border-radius: 12px;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 10px;
        box-shadow: 0 0 20px var(--accent-purple);
      }

      .play-btn:hover {
        transform: scale(1.05);
        background: #fff;
      }

      /* NORMÁL BENTO CSEMPÉK */
      .card-btn {
        height: 100%;
        min-height: 80px;
        border-radius: 18px;
        padding: 20px 24px;
        background: rgba(18, 10, 32, 0.75) !important;
        border: 1px solid rgba(168, 85, 247, 0.25) !important;
      }

      .card-btn:hover {
        border-color: var(--glow-purple) !important;
        background: rgba(30, 16, 58, 0.85) !important;
        transform: translateY(-4px) !important;
        box-shadow: 0 10px 25px rgba(168, 85, 247, 0.25) !important;
      }

      /* KÜLÖNLEGES SZÉLES CSEMPE A DISCORDNAK OBLIGÁT HIDEG SZÍNNEL */
      .card-btn.wide {
        grid-column: 2 / 4;
      }
    }
 <!-- ==========================================
     [SECTION 3: STRUKTURÁLT BENTO DASHBOARD]
     ========================================== -->
  <div class="main-container">

    <!-- BAL OLDAL: STABIL PROFIL BLOKK -->
    <header>
      <div class="brand">
        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=sanci9517" class="avatar" alt="SANCI9517">
        <div class="brand-text">
          <h1>SANCI9517</h1>
          <p>OFFICIAL STREAMER HUB</p>
        </div>
      </div>

      <div class="stats-badge">
        <div style="font-family:'Orbitron'; font-size:1.1rem; font-weight:800; color:#fff;">1080p 60FPS</div>
        <div style="font-size:0.75rem; color:var(--text-sub); margin-top:3px;">HIGH QUALITY STREAM</div>
      </div>

      <div class="theme-switcher">
        <div class="dot purple" onclick="setTheme('purple')"></div>
        <div class="dot green" onclick="setTheme('green')"></div>
        <div class="dot blue" onclick="setTheme('blue')"></div>
      </div>
    </header>

    <!-- JOBB OLDAL: KIEGYENSÚLYOZOTT BENTO MÁTRIX -->
    <div class="hero-card">
      <div>
        <h2>NÉZD AZ ÉLŐ ADÁST!</h2>
        <p>Kattints a gombra és csatlakozz a streamhez.</p>
      </div>
      <button class="play-btn" onclick="openStreamModal()">
        <i class="fa-solid fa-play"></i> STREAM INDÍTÁSA
      </button>
    </div>

    <div class="links-wrapper">
      <a href="https://www.twitch.tv/sanci9517" target="_blank" class="card-btn">
        <div class="card-left"><i class="fa-brands fa-twitch"></i><span>Twitch</span></div>
        <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:0.85rem; color:var(--text-sub);"></i>
      </a>

      <a href="https://youtube.com" target="_blank" class="card-btn">
        <div class="card-left"><i class="fa-brands fa-youtube"></i><span>YouTube</span></div>
        <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:0.85rem; color:var(--text-sub);"></i>
      </a>

      <a href="https://discord.gg" target="_blank" class="card-btn wide">
        <div class="card-left"><i class="fa-brands fa-discord"></i><span>Discord Közösségi Szerver</span></div>
        <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:0.85rem; color:var(--text-sub);"></i>
      </a>

      <a href="https://tiktok.com" target="_blank" class="card-btn">
        <div class="card-left"><i class="fa-brands fa-tiktok"></i><span>TikTok</span></div>
        <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:0.85rem; color:var(--text-sub);"></i>
      </a>

      <a href="https://instagram.com" target="_blank" class="card-btn">
        <div class="card-left"><i class="fa-brands fa-instagram"></i><span>Instagram</span></div>
        <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:0.85rem; color:var(--text-sub);"></i>
      </a>
    </div>

  </div>
  <!-- ==========================================
     [SECTION 4: JAVASCRIPT PROGRAMKÓD (LOGIKA)]
     ========================================== -->
  <script>
    // Automatikusan kezeli a domént a Twitch biztonsági előírásaihoz
    const currentDomain = window.location.hostname || "sanci9517.github.io";

    function openStreamModal() {
      document.getElementById('modal').classList.add('active');
      showModalTab('video');
      document.addEventListener('keydown', handleEscKey);
    }

    function closeStreamModal() {
      document.getElementById('modal').classList.remove('active');
      document.getElementById('modal-body').innerHTML = ''; // Bezáráskor leállítja a lejátszást
      document.removeEventListener('keydown', handleEscKey);
    }

    function handleEscKey(e) {
      if (e.key === "Escape") closeStreamModal();
    }

    function showModalTab(tabType) {
      const body = document.getElementById('modal-body');
      const videoBtn = document.getElementById('tab-video-btn');
      const chatBtn = document.getElementById('tab-chat-btn');

      if(tabType === 'video') {
        videoBtn.classList.add('active');
        chatBtn.classList.remove('active');
        body.innerHTML = `<iframe src="https://player.twitch.tv/?channel=sanci9517&parent=${currentDomain}&autoplay=true" allowfullscreen></iframe>`;
      } else {
        chatBtn.classList.add('active');
        videoBtn.classList.remove('active');
        body.innerHTML = `<iframe src="https://www.twitch.tv/embed/sanci9517/chat?parent=${currentDomain}"></iframe>`;
      }
    }

    function setTheme(theme) {
      if(theme === 'purple') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', theme);
    }
  </script>
</body>
</html>
