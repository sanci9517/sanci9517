  <style>

    /* =========================================
       ALAP
    ========================================= */

    :root {
      --bg-dark: #07040d;
      --card-bg: #120a22;
      --card-bg-2: #1a0f30;

      --accent: #a855f7;
      --accent-dark: #7e22ce;

      --border: rgba(168, 85, 247, 0.35);

      --text: #ffffff;
      --text-sub: #c084fc;
      --text-muted: #94a3b8;

      --live-red: #ef4444;
      --gold: #eab308;

      --twitch: #9146ff;
      --youtube: #ff0000;
      --tiktok: #00f2fe;
      --discord: #5865f2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-dark);

      background-image:
        radial-gradient(
          circle at 50% 0%,
          rgba(168, 85, 247, 0.28) 0%,
          transparent 65%
        );

      color: var(--text);

      font-family: 'Rajdhani', sans-serif;

      min-height: 100vh;

      padding: 20px 15px 40px;

      display: flex;
      flex-direction: column;
      align-items: center;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font-family: inherit;
    }


    /* =========================================
       NAVIGÁCIÓ
    ========================================= */

    .nav-tabs {
      display: flex;

      gap: 6px;

      margin-bottom: 20px;

      width: 100%;
      max-width: 650px;

      overflow-x: auto;

      padding-bottom: 6px;

      scrollbar-width: thin;
      scrollbar-color: var(--accent) transparent;
    }

    .nav-btn {
      flex: 1;

      min-width: 105px;

      white-space: nowrap;

      background: var(--card-bg);

      border: 1px solid var(--border);

      color: var(--text);

      padding: 10px 8px;

      border-radius: 12px;

      font-family: 'Orbitron', sans-serif;

      font-size: 0.68rem;

      font-weight: 700;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 6px;

      transition:
        transform 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
    }

    .nav-btn:hover {
      transform: translateY(-2px);

      background: var(--card-bg-2);

      box-shadow:
        0 0 12px rgba(168, 85, 247, 0.25);
    }

    .nav-btn.active {
      background: var(--accent);

      color: #000;

      border-color: #fff;

      box-shadow:
        0 0 15px rgba(168, 85, 247, 0.75);
    }


    /* =========================================
       MAIN
    ========================================= */

    .main-container {
      width: 100%;
      max-width: 600px;
    }

    .tab-content {
      display: none;

      flex-direction: column;

      gap: 16px;

      animation: fadeIn 0.25s ease;
    }

    .tab-content.active {
      display: flex;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }


    /* =========================================
       PROFILE
    ========================================= */

    .profile-card {
      background: var(--card-bg);

      border: 1px solid var(--border);

      border-radius: 20px;

      padding: 22px;

      text-align: center;

      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 10px;

      position: relative;

      overflow: hidden;
    }

    .profile-card::before {
      content: "";

      position: absolute;

      top: -100px;
      left: 50%;

      width: 220px;
      height: 220px;

      transform: translateX(-50%);

      background: rgba(168, 85, 247, 0.18);

      filter: blur(50px);

      pointer-events: none;
    }

    .avatar-wrapper {
      position: relative;

      z-index: 1;
    }

    .avatar {
      width: 95px;
      height: 95px;

      border-radius: 50%;

      border: 3px solid var(--accent);

      object-fit: cover;

      background: var(--card-bg-2);

      box-shadow:
        0 0 20px rgba(168, 85, 247, 0.45);
    }

    .live-badge {
      display: none;

      position: absolute;

      bottom: -6px;
      left: 50%;

      transform: translateX(-50%);

      background: var(--live-red);

      color: white;

      font-family: 'Orbitron', sans-serif;

      font-size: 0.65rem;

      font-weight: 800;

      padding: 3px 9px;

      border-radius: 10px;

      border: 2px solid var(--card-bg);

      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {

      0% {
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
      }

      70% {
        box-shadow: 0 0 0 8px rgba(239, 68, 68, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
      }
    }

    .brand-title {
      font-family: 'Orbitron', sans-serif;

      font-size: 1.6rem;

      font-weight: 800;
    }

    .brand-sub {
      color: var(--text-sub);

      font-size: 0.85rem;

      font-weight: 700;
    }


    /* =========================================
       COUNTDOWN
    ========================================= */

    .countdown-box {
      background: rgba(168, 85, 247, 0.1);

      border: 1px dashed var(--accent);

      border-radius: 10px;

      padding: 9px 14px;

      font-size: 0.85rem;

      color: #fff;

      display: flex;

      align-items: center;

      gap: 8px;

      margin-top: 4px;
    }


    /* =========================================
       STREAM GOMB
    ========================================= */

    .stream-play-btn {
      width: 100%;

      background:
        linear-gradient(
          135deg,
          var(--accent),
          var(--accent-dark)
        );

      color: white;

      border: 1px solid #fff;

      padding: 14px;

      border-radius: 14px;

      font-family: 'Orbitron', sans-serif;

      font-size: 0.9rem;

      font-weight: 800;

      cursor: pointer;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 10px;

      box-shadow:
        0 0 15px rgba(168, 85, 247, 0.3);

      transition: 0.2s ease;
    }

    .stream-play-btn:hover {
      transform: translateY(-2px);

      box-shadow:
        0 0 25px rgba(168, 85, 247, 0.6);
    }

    .stream-play-btn:active {
      transform: scale(0.98);
    }


    /* =========================================
       LINK GOMBOK
    ========================================= */

    .card-btn {
      display: flex;

      align-items: center;

      justify-content: space-between;

      text-decoration: none;

      color: #fff;

      font-weight: 700;

      font-size: 1rem;

      padding: 14px 18px;

      border-radius: 14px;

      background: var(--card-bg-2);

      border: 1px solid var(--border);

      transition: 0.2s ease;
    }

    .card-btn:hover {
      transform: translateY(-2px);

      background: #21133c;

      box-shadow:
        0 5px 20px rgba(0, 0, 0, 0.3);
    }

    .card-btn.twitch {
      border-left: 5px solid var(--twitch);
    }

    .card-btn.youtube {
      border-left: 5px solid var(--youtube);
    }

    .card-btn.tiktok {
      border-left: 5px solid var(--tiktok);
    }

    .card-btn.x-twitter {
      border-left: 5px solid white;
    }

    .card-btn.discord {
      border-left: 5px solid var(--discord);
    }

    .card-btn.support {
      border-left: 5px solid var(--gold);
    }

    .card-left {
      display: flex;

      align-items: center;

      gap: 12px;
    }

    .card-left i {
      font-size: 1.2rem;

      width: 24px;

      text-align: center;
    }


    /* =========================================
       INFO CARD
    ========================================= */

    .info-card {
      background: var(--card-bg-2);

      border: 1px solid var(--border);

      border-radius: 14px;

      padding: 16px;
    }

    .info-card.active-day {
      border: 2px solid var(--accent);

      box-shadow:
        0 0 12px rgba(168, 85, 247, 0.2);
    }

    .card-header-text {
      font-family: 'Orbitron', sans-serif;

      color: var(--accent);

      font-size: 1rem;

      margin-bottom: 8px;

      display: flex;

      justify-content: space-between;

      align-items: center;
    }

    .card-header-text small {
      color: var(--text-muted);

      font-family: 'Rajdhani', sans-serif;

      font-size: 0.8rem;
    }


    /* =========================================
       SETUP
    ========================================= */

    .setup-row {
      display: flex;

      justify-content: space-between;

      gap: 15px;

      padding: 7px 0;

      border-bottom: 1px solid rgba(255,255,255,0.05);

      font-size: 0.9rem;
    }

    .setup-row:last-child {
      border-bottom: none;
    }

    .setup-row span:last-child {
      text-align: right;
    }


    /* =========================================
       STATOK
    ========================================= */

    .stats-grid {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 10px;
    }

    .stat-box {
      background: var(--card-bg);

      border: 1px solid var(--border);

      border-radius: 12px;

      padding: 12px;

      text-align: center;
    }

    .stat-val {
      font-family: 'Orbitron', sans-serif;

      font-size: 1.1rem;

      color: var(--accent);

      font-weight: 800;

      min-height: 22px;
    }

    .stat-lbl {
      font-size: 0.75rem;

      color: var(--text-muted);

      margin-top: 3px;
    }


    /* =========================================
       SZAVAZÁS
    ========================================= */

    .poll-opt {
      background: rgba(255,255,255,0.05);

      border: 1px solid var(--border);

      padding: 12px 16px;

      border-radius: 10px;

      margin-top: 10px;

      cursor: pointer;

      display: flex;

      justify-content: space-between;

      font-weight: 700;

      transition: 0.2s ease;
    }

    .poll-opt:hover {
      background: var(--accent);

      color: #000;

      transform: translateY(-2px);
    }

    .poll-opt.voted {
      background: rgba(168,85,247,0.25);

      border-color: var(--accent);

      cursor: default;
    }


    /* =========================================
       KLIP
    ========================================= */

    .clip-container {
      width: 100%;

      height: 280px;

      border-radius: 12px;

      overflow: hidden;

      border: 1px solid var(--border);

      background: #000;

      margin-top: 10px;
    }

    .clip-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }


    /* =========================================
       MODAL
    ========================================= */

    .modal-overlay {
      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      background: rgba(0,0,0,0.9);

      backdrop-filter: blur(8px);

      display: none;

      justify-content: center;

      align-items: center;

      z-index: 9999;

      padding: 15px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: #0a0518;

      border: 1px solid var(--border);

      border-radius: 16px;

      width: 100%;

      max-width: 850px;

      overflow: hidden;

      box-shadow:
        0 0 40px rgba(168,85,247,0.3);
    }

    .modal-header {
      padding: 10px 16px;

      background: var(--card-bg);

      display: flex;

      justify-content: space-between;

      align-items: center;

      border-bottom: 1px solid var(--border);
    }

    .modal-tabs {
      display: flex;

      gap: 8px;
    }

    .m-tab-btn {
      background: rgba(255,255,255,0.05);

      border: 1px solid var(--border);

      color: white;

      padding: 7px 14px;

      border-radius: 8px;

      font-family: 'Orbitron', sans-serif;

      font-size: 0.72rem;

      font-weight: 700;

      cursor: pointer;

      transition: 0.2s ease;
    }

    .m-tab-btn.active {
      background: var(--accent);

      color: #000;

      border-color: #fff;
    }

    .close-btn {
      background: transparent;

      border: none;

      color: white;

      font-size: 1.6rem;

      cursor: pointer;

      padding: 2px 6px;
    }

    .close-btn:hover {
      color: var(--accent);
    }

    .modal-body {
      width: 100%;

      height: 55vh;

      max-height: 500px;

      min-height: 300px;

      background: #000;
    }

    .modal-body iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .modal-message {
      height: 100%;

      display: flex;

      align-items: center;

      justify-content: center;

      text-align: center;

      padding: 30px;

      color: var(--text-muted);

      font-size: 1rem;
    }


    /* =========================================
       MOBIL
    ========================================= */

    @media (max-width: 600px) {

      body {
        padding: 12px 10px 30px;
      }

      .nav-tabs {
        margin-bottom: 14px;
      }

      .nav-btn {
        min-width: 95px;

        font-size: 0.62rem;

        padding: 9px 6px;
      }

      .profile-card {
        padding: 18px;
      }

      .avatar {
        width: 85px;
        height: 85px;
      }

      .brand-title {
        font-size: 1.35rem;
      }

      .setup-row {
        flex-direction: column;

        gap: 2px;
      }

      .setup-row span:last-child {
        text-align: left;
      }

      .clip-container {
        height: 220px;
      }

      .modal-header {
        padding: 8px 10px;
      }

      .m-tab-btn {
        padding: 6px 9px;

        font-size: 0.62rem;
      }
    }

  </style>
</head>
