<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SANCI9517 | Official Streamer Hub</title>

  <!-- ==========================================
     [SECTION 1: BETŰTÍPUSOK ÉS IKONOK (FA 6.5.1)]
     ========================================== -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- ==========================================
     [SECTION 2: CSS STÍLUSOK]
     ========================================== -->
  <style>
    :root {
      --bg-dark: #07040d;
      --card-bg-primary: #120a22;
      --card-bg-secondary: #1a0f30;
      --card-bg-accent: #231242;
      
      --accent-purple: #a855f7;
      --accent-pink: #ec4899;
      --accent-blue: #3b82f6;
      --accent-red: #ef4444;

      --border-purple: rgba(168, 85, 247, 0.35);

      --text-main: #ffffff;
      --text-sub: #c084fc;
      --text-muted: #94a3b8;
    }

    [data-theme="green"] {
      --accent-purple: #10b981;
      --border-purple: rgba(16, 185, 129, 0.4);
      --card-bg-primary: #061e16;
      --card-bg-secondary: #0b2d22;
      --text-sub: #6ee7b7;
    }

    [data-theme="blue"] {
      --accent-purple: #3b82f6;
      --border-purple: rgba(59, 130, 246, 0.4);
      --card-bg-primary: #0a1628;
      --card-bg-secondary: #11223f;
      --text-sub: #93c5fd;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(168, 85, 247, 0.2) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(59, 130, 246, 0.18) 0%, transparent 45%);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px 100px 15px;
    }

    header, .hero-card, .card-btn, .schedule-card, .setup-card {
      border-radius: 20px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    /* NAVIGÁCIÓS FÜLEK */
    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 1150px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .nav-btn {
      background: var(--card-bg-primary);
      border: 1px solid var(--border-purple);
      color: var(--text-main);
      padding: 12px 24px;
      border-radius: 14px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-btn.active, .nav-btn:hover {
      background: var(--accent-purple);
      color: #000;
      border-color: #fff;
      box-shadow: 0 0 15px var(--accent-purple);
    }

    /* WEBES (DESKTOP) LAYOUT */
    @media (min-width: 900px) {
      body { padding: 40px 20px 120px 20px; }

      .main-container {
        width: 100%;
        max-width: 1150px;
        display: grid;
        grid-template-columns: 340px 1fr 1fr;
        gap: 22px;
      }

      header {
        grid-column: 1 / 2;
        grid-row: 1 / 5;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        text-align: center;
        padding: 40px 24px;
        background: linear-gradient(180deg, var(--card-bg-primary), #0c0617);
        border: 2px solid var(--border-purple);
      }

      .tab-content {
        grid-column: 2 / 4;
        display: none;
        flex-direction: column;
        gap: 20px;
      }

      .tab-content.active {
        display: flex;
      }

      .hero-card {
        background: linear-gradient(135deg, var(--card-bg-secondary), var(--card-bg-accent));
        border: 2px solid var(--accent-purple);
        padding: 28px 32px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .links-wrapper {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      .card-btn.wide { grid-column: 1 / -1; }
    }

    /* MOBIL LAYOUT */
    @media (max-width: 899px) {
      .main-container {
        width: 100%;
        max-width: 550px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      header {
        padding: 24px 20px;
        background: var(--card-bg-primary);
        border: 1px solid var(--border-purple);
        display: flex;
        flex-direction: column;
        gap: 18px;
        text-align: center;
      }

      .tab-content {
        display: none;
        flex-direction: column;
        gap: 16px;
      }

      .tab-content.active { display: flex; }

      .hero-card {
        background: linear-gradient(135deg, var(--card-bg-secondary), var(--card-bg-accent));
        border: 1px solid var(--accent-purple);
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 15px;
        text-align: center;
      }

      .links-wrapper {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
    }

    /* PROFIL PANEL */
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .avatar-container { position: relative; }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 3px solid var(--accent-purple);
      object-fit: cover;
    }

    .live-badge-inline {
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.65rem;
      font-weight: 900;
      padding: 3px 10px;
      border-radius: 12px;
      text-transform: uppercase;
    }

    .live-badge-inline.online { background: var(--accent-red); color: #fff; }
    .live-badge-inline.offline { background: #334155; color: #94a3b8; }

    .brand-text h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.7rem;
      color: #ffffff;
    }

    .brand-text p {
      font-size: 0.85rem;
      color: var(--text-sub);
      font-weight: 700;
    }

    .stats-box {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-purple);
      padding: 16px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .stat-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
    }

    .stat-label { color: var(--text-muted); font-weight: 600; }
    .stat-value { font-family: 'Orbitron'; font-weight: 800; color: #fff; }

    /* LINK GOMBOK */
    .card-btn {
      position: relative;
      display: flex !important;
      align-items: center;
      justify-content: space-between;
      text-decoration: none !important;
      color: #ffffff !important;
      font-weight: 700;
      font-size: 1.1rem;
      padding: 20px 24px;
      border-radius: 16px;
      background: var(--card-bg-secondary);
      border: 1px solid var(--border-purple);
      cursor: pointer;
    }

    .card-btn.twitch { border-left: 6px solid #9146FF; }
    .card-btn.youtube { border-left: 6px solid #FF0000; }
    .card-btn.tiktok  { border-left: 6px solid #00F2FE; }
    .card-btn.x-twitter { border-left: 6px solid #FFFFFF; }
    .card-btn.discord { border-left: 6px solid #5865F2; }

    .card-btn:hover {
      transform: translateY(-3px);
      background: var(--card-bg-accent);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .card-left { display: flex; align-items: center; gap: 16px; pointer-events: none; }
    .card-left i { font-size: 1.5rem; width: 30px; text-align: center; }

    .twitch i { color: #a970ff; }
    .youtube i { color: #ff4d4d; }
    .tiktok i  { color: #00f2fe; }
    .x-twitter i { color: #ffffff; }
    .discord i { color: #5865f2; }

    /* LÁTVÁNYOS MENETREND STÍLUS */
    .schedule-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 14px;
    }

    .schedule-card {
      background: var(--card-bg-secondary);
      border: 1px solid var(--border-purple);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
      overflow: hidden;
    }

    .schedule-card.active-day {
      border: 2px solid var(--accent-purple);
      background: linear-gradient(135deg, var(--card-bg-secondary), var(--card-bg-accent));
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.2);
    }

    .schedule-day {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      color: var(--accent-purple);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .schedule-time {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 700;
    }

    .schedule-game {
      font-size: 1.1rem;
      font-weight: 800;
      color: #fff;
    }

    .schedule-desc {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    /* SETUP STÍLUS */
    .setup-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
    }

    .setup-card {
      background: var(--card-bg-secondary);
      border: 1px solid var(--border-purple);
      padding: 20px;
    }

    .setup-card h3 {
      font-family: 'Orbitron', sans-serif;
      color: var(--accent-purple);
      font-size: 1rem;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .setup-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.9rem;
    }

    .setup-item:last-child { border-bottom: none; }
    .setup-key { color: var(--text-muted); }
    .setup-val { color: #fff; font-weight: 700; }

    .theme-switcher {
      display: flex;
      gap: 12px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-purple);
      padding: 8px 14px;
      border-radius: 20px;
    }

    .dot { width: 14px; height: 14px; border-radius: 50%; cursor: pointer; }
    .dot.purple { background: #a855f7; }
    .dot.green  { background: #10b981; }
    .dot.blue   { background: #3b82f6; }

    /* LEBEGŐ GOMB ÉS MODAL */
    .floating-live-btn {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: linear-gradient(135deg, #ef4444, #a855f7);
      border: 2px solid #ffffff;
      color: white;
      padding: 14px 24px;
      border-radius: 50px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      z-index: 999;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(14px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      padding: 15px;
    }
    .modal-overlay.active { display: flex; }

    .modal-content {
      background: #0a0518;
      border: 2px solid var(--border-purple);
      border-radius: 20px;
      width: 100%;
      max-width: 900px;
      overflow: hidden;
    }

    .modal-header {
      background: var(--card-bg-primary);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-purple);
    }

    .modal-tabs { display: flex; gap: 10px; }
    .m-tab-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-purple);
      color: white;
      padding: 8px 18px;
      border-radius: 10px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .m-tab-btn.active {
      background: var(--accent-purple);
      color: #000;
      border-color: #fff;
    }

    .close-btn { background: transparent; border: none; color: white; font-size: 1.8rem; cursor: pointer; }
    .modal-body { width: 100%; height: 65vh; max-height: 540px; background: #000; }
    .modal-body iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <!-- FŐ NAVIGÁCIÓS FÜLEK -->
  <div class="nav-tabs">

  <!-- ==========================================
     [SECTION 4: JAVASCRIPT]
     ========================================== -->
  <script>
    const TWITCH_CHANNEL = "sanci9517";
    const currentDomain = window.location.hostname || "localhost";

    // FÜLEK KÖZÖTTI VÁLTÁS
    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));

      document.getElementById(`tab-${tabName}`).classList.add('active');
      event.currentTarget.classList.add('active');
    }

    // MENETREND BETÖLTÉSE JSON FÁJLBÓL
    async function loadSchedule() {
      try {
        const response = await fetch('schedule.json');
        const scheduleData = await response.json();
        const container = document.getElementById('schedule-container');
        container.innerHTML = '';

        scheduleData.forEach(item => {
          const card = document.createElement('div');
          card.className = `schedule-card ${item.active ? 'active-day' : ''}`;
          card.innerHTML = `
            <div class="schedule-day">
              <span>${item.day}</span>
              ${item.active ? '<i class="fa-solid fa-circle-play" style="color:var(--accent-purple);"></i
