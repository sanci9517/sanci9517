  <style>
    /* Fallback for Android browsers opened with "Desktop site" enabled. */
    html.mobile-device .page-blocks { grid-template-columns: 1fr !important; }
    html.mobile-device .page-block,
    html.mobile-device .page-block.page-block-width-full,
    html.mobile-device .page-block.page-block-width-half,
    html.mobile-device .page-block.page-block-width-third,
    html.mobile-device .page-block.page-block-width-quarter,
    html.mobile-device .page-block.page-block-width-auto { grid-column: 1 / -1 !important; }
    html.mobile-device .composite-elements { grid-template-columns: 1fr !important; gap: 14px; }
    html.mobile-device .composite-element,
    html.mobile-device .composite-element.composite-width-full,
    html.mobile-device .composite-element.composite-width-half,
    html.mobile-device .composite-element.composite-width-third,
    html.mobile-device .composite-element.composite-width-quarter,
    html.mobile-device .composite-element.composite-width-auto { grid-column: 1 / -1 !important; }
    html.mobile-device .home-hero { grid-template-columns: 1fr !important; gap: 44px; padding-block: 56px 48px; min-height: auto; }
    html.mobile-device .home-title { font-size: clamp(52px, 15.5vw, 72px); }
    html.mobile-device .home-actions { margin-top: 26px; }
    html.mobile-device .home-panel { min-height: 300px; padding: 22px; }
    html.mobile-device .home-panel-main { padding-block: 36px; }
    html.mobile-device .site-menu { top: calc(100% + 8px); right: -4px; min-width: 230px; max-width: calc(100vw - 32px); max-height: calc(100dvh - 84px); padding: 18px; }
    html.mobile-device .site-menu-header { gap: 18px; }
    html.mobile-device .site-menu-header h2 { font-size: 26px; }
    html.mobile-device .menu-link { min-height: 48px; gap: 20px; }
  </style>
