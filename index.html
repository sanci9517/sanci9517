<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SANCI9517 | Official Streamer Hub</title>

  <!-- ==========================================
     [SECTION 1: BETŰTÍPUSOK ÉS IKONOK]
     ========================================== -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- ==========================================
     [SECTION 2: CSS STÍLUSOK]
     ========================================== -->
  <style>
    :root {
      --bg-dark: #07040d;
      --card-bg-primary: #120a22;
      --card-bg-secondary: #1a0f30;
      --card-bg-accent: #231242;
      
      --accent-purple: #a855f7;
      --accent-pink: #ec4899;
      --accent-blue: #3b82f6;
      --accent-red: #ef4444;

      --border-purple: rgba(168, 85, 247, 0.35);

      --text-main: #ffffff;
      --text-sub: #c084fc;
      --text-muted: #94a3b8;
    }

    [data-theme="green"] {
      --accent-purple: #10b981;
      --border-purple: rgba(16, 185, 129, 0.4);
      --card-bg-primary: #061e16;
      --card-bg-secondary: #0b2d22;
      --text-sub: #6ee7b7;
    }

    [data-theme="blue"] {
      --accent-purple: #3b82f6;
      --border-purple: rgba(59, 130, 246, 0.4);
      --card-bg-primary: #0a1628;
      --card-bg-secondary: #11223f;
      --text-sub: #93c5fd;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(168, 85, 247, 0.2) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(59, 130, 246, 0.18) 0%, transparent 45%);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px 100px 15px;
    }

    header, .hero-card, .card-btn {
      border-radius: 20px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    /* WEBES (DESKTOP) LAYOUT */
    @media (min-width: 900px) {
      body { padding: 50px 20px 120px 20px; }

      .main-container {
        width: 100%;
        max-width: 1150px;
        display: grid;
        grid-template-columns: 340px 1fr 1fr;
        gap: 22px;
      }

      header {
        grid-column: 1 / 2;
        grid-row: 1 / 4;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        text-align: center;
        padding: 40px 24px;
        background: linear-gradient(180deg, var(--card-bg-primary), #0c0617);
        border: 2px solid var(--border-purple);
      }

      .hero-card {
        grid-column: 2 / 4;
        background: linear-gradient(135deg, var(--card-bg-secondary), var(--card-bg-accent));
        border: 2px solid var(--accent-purple);
        padding: 28px 32px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .links-wrapper {
        grid-column: 2 / 4;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
    }

    /* MOBIL LAYOUT */
    @media (max-width: 899px) {
      .main-container {
        width: 100%;
        max-width: 550px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      header {
        padding: 24px 20px;
        background: var(--card-bg-primary);
        border: 1px solid var(--border-purple);
        display: flex;
        flex-direction: column;
        gap: 18px;
        text-align: center;
      }

      .hero-card {
        background: linear-gradient(135deg, var(--card-bg-secondary), var(--card-bg-accent));
        border: 1px solid var(--accent-purple);
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 15px;
        text-align: center;
      }

      .links-wrapper {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
    }

    /* PROFIL */
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .avatar-container { position: relative; }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 3px solid var(--accent-purple);
      object-fit: cover;
    }

    .live-badge-inline {
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.65rem;
      font-weight: 900;
      padding: 3px 10px;
      border-radius: 12px;
      text-transform: uppercase;
    }

    .live-badge-inline.online { background: var(--accent-red); color: #fff; }
    .live-badge-inline.offline { background: #334155; color: #94a3b8; }

    .brand-text h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.7rem;
      color: #ffffff;
    }

    .brand-text p {
      font-size: 0.85rem;
      color: var(--text-sub);
      font-weight: 700;
    }

    .stats-box {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-purple);
      padding: 16px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .stat-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
    }

    .stat-label { color: var(--text-muted); font-weight: 600; }
    .stat-value { font-family: 'Orbitron'; font-weight: 800; color: #fff; }

    /* KÖZÖSSÉGI LINK GOMBOK */
    .card-btn {
      position: relative;
      z-index: 5;
      display: flex !important;
      align-items: center;
      justify-content: space-between;
      text-decoration: none !important;
      color: #ffffff !important;
      font-weight: 700;
      font-size: 1.1rem;
      padding: 20px 24px;
      border-radius: 16px;
      background: var(--card-bg-secondary);
      border: 1px solid var(--border-purple);
      cursor: pointer;
    }

    .card-btn.twitch { border-left: 6px solid #9146FF; }
    .card-btn.youtube { border-left: 6px solid #FF0000; }
    .card-btn.tiktok  { border-left: 6px solid #00F2FE; }
    .card-btn.x-twitter { border-left: 6px solid #FFFFFF; }

    .card-btn:hover {
      transform: translateY(-3px);
      background: var(--card-bg-accent);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .card-left { display: flex; align-items: center; gap: 16px; pointer-events: none; }
    .card-left i { font-size: 1.5rem; width: 30px; text-align: center; }

    .twitch i { color: #a970ff; }
    .youtube i { color: #ff4d4d; }
    .tiktok i  { color: #00f2fe; }
    .x-twitter i { color: #ffffff; }

    .theme-switcher {
      display: flex;
      gap: 12px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-purple);
      padding: 8px 14px;
      border-radius: 20px;
    }

    .dot { width: 14px; height: 14px; border-radius: 50%; cursor: pointer; }
    .dot.purple { background: #a855f7; }
    .dot.green  { background: #10b981; }
    .dot.blue   { background: #3b82f6; }

    /* LEBEGŐ "ÉLŐ ADÁS" GOMB */
    .floating-live-btn {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: linear-gradient(135deg, #ef4444, #a855f7);
      border: 2px solid #ffffff;
      color: white;
      padding: 14px 24px;
      border-radius: 50px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      z-index: 999;
    }

    /* STREAM & CHAT MODAL */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(14px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      padding: 15px;
    }
    .modal-overlay.active { display: flex; }

    .modal-content {
      background: #0a0518;
      border: 2px solid var(--border-purple);
      border-radius: 20px;
      width: 100%;
      max-width: 900px;
      overflow: hidden;
    }

    .modal-header {
      background: var(--card-bg-primary);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-purple);
    }

    .modal-tabs { display: flex; gap: 10px; }
    .m-tab-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-purple);
      color: white;
      padding: 8px 18px;
      border-radius: 10px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .m-tab-btn.active {
      background: var(--accent-purple);
      color: #000;
      border-color: #fff;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: white;
      font-size: 1.8rem;
      cursor: pointer;
    }

    .modal-body {
      width: 100%;
      height: 65vh;
      max-height: 540px;
      background: #000;
    }

    .modal-body iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <!-- ==========================================
     [SECTION 3: HTML TARTALOM]
     ========================================== -->
  <div class="main-container">

    <!-- BAL PROFIL PANEL -->
    <header>
      <div class="brand">
        <div class="avatar-container">
          <img id="twitch-avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=sanci9517" class="avatar" alt="SANCI9517">
          <div id="live-status-badge" class="live-badge-inline offline">OFFLINE</div>
        </div>
        <div class="brand-text">
          <h1 id="twitch-display-name">SANCI9517</h1>
          <p>STREAMER & TARTALOMKÉSZÍTŐ</p>
        </div>
      </div>

      <!-- ADATOK -->
      <div class="stats-box">
        <div class="stat-item">
          <span class="stat-label"><i class="fa-solid fa-users"></i> Követők:</span>
          <span id="twitch-followers" class="stat-value">---</span>
        </div>
        <div class="stat-item">
          <span class="stat-label"><i class="fa-solid fa-gamepad"></i> Kategória:</span>
          <span id="twitch-game" class="stat-value" style="font-size: 0.75rem;">---</span>
        </div>
        <div class="stat-item">
          <span class="stat-label"><i class="fa-solid fa-eye"></i> Nézők:</span>
          <span id="twitch-viewers" class="stat-value">---</span>
        </div>
      </div>

      <div class="theme-switcher">
        <div class="dot purple" onclick="setTheme('purple')"></div>
        <div class="dot green" onclick="setTheme('green')"></div>
        <div class="dot blue" onclick="setTheme('blue')"></div>
      </div>
    </header>

    <!-- BENTO BANNER -->
    <div class="hero-card">
      <div>
        <h2 id="stream-title" style="font-family:'Orbitron'; font-size:1.2rem; color:#fff; margin-bottom:6px;">
          NÉZD AZ ÉLŐ ADÁST!
        </h2>
        <p id="stream-subtitle" style="color:var(--text-sub); font-size:0.9rem;">
          Csatlakozz a streamhez közvetlenül itt vagy nyisd meg a csatornát!
        </p>
      </div>
      <button class="m-tab-btn active" onclick="openStreamModal()" style="padding:14px 24px; font-size:0.9rem; cursor:pointer;">
        <i class="fa-solid fa-play"></i> STREAM LEJÁTSZÁSA
      </button>
    </div>

    <!-- PONTOS KÖZÖSSÉGI LINKEK -->
    <div class="links-wrapper">
      
      <!-- TWITCH LINK -->
      <a href="https://m.twitch.tv/sanci9517" target="_blank" rel="noopener noreferrer" class="card-btn twitch">
        <div class="card-left">
          <i class="fa-brands fa-twitch"></i>
          <span>Twitch Csatorna</span>
        </div>
        <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:0.85rem; color:var(--text-sub);"></i>
      </a>

      <!-- YOUTUBE LINK -->
      <a href="https://youtube.com/@sanci9517vod?si=0OFY7fLlho9VGUqW" target="_blank" rel="noopener noreferrer" class="card-btn youtube">
        <div class="card-left">
          <i class="fa-brands fa-youtube"></i>
          <span>YouTube VODs</span>
        </div>
        <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:0.85rem; color:var(--text-sub);"></i>
      </a>

      <!-- TIKTOK LINK -->
      <a href="https://www.tiktok.com/@sanci9517twitch" target="_blank" rel="noopener noreferrer" class="card-btn tiktok">
        <div class="card-left">
          <i class="fa-brands fa-tiktok"></i>
          <span>TikTok</span>
        </div>
        <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:0.85rem; color:var(--text-sub);"></i>
      </a>

      <!-- X / TWITTER LINK -->
      <a href="https://x.com/Sanci9517" target="_blank" rel="noopener noreferrer" class="card-btn x-twitter">
        <div class="card-left">
          <i class="fa-brands fa-x-twitter"></i>
          <span>X / Twitter</span>
        </div>
        <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:0.85rem; color:var(--text-sub);"></i>
      </a>

    </div>

  </div>

  <!-- LEBEGŐ GOMB -->
  <button class="floating-live-btn" onclick="openStreamModal()">
    <i class="fa-solid fa-tv"></i>
    <span>ÉLŐ ADÁS</span>
  </button>

  <!-- MODAL -->
  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-tabs">
          <button class="m-tab-btn active" id="tab-video-btn" onclick="showModalTab('video')">
            <i class="fa-solid fa-play"></i> STREAM
          </button>
          <button class="m-tab-btn" id="tab-chat-btn" onclick="showModalTab('chat')">
            <i class="fa-solid fa-comments"></i> CHAT
          </button>
        </div>
        <button class="close-btn" onclick="closeStreamModal()">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- ==========================================
     [SECTION 4: JAVASCRIPT]
     ========================================== -->
  <script>
    const TWITCH_CHANNEL = "sanci9517";
    const currentDomain = window.location.hostname || "localhost";

    async function fetchTwitchData() {
      try {
        const response = await fetch(`https://decapi.me/twitch/uptime/${TWITCH_CHANNEL}`);
        const uptimeText = await response.text();

        const isLive = !uptimeText.includes("offline") && !uptimeText.includes("error");
        
        const badge = document.getElementById('live-status-badge');
        const viewersElem = document.getElementById('twitch-viewers');
        const titleElem = document.getElementById('stream-title');

        if (isLive) {
          badge.innerText = "LIVE";
          badge.className = "live-badge-inline online";
          
          const viewReq = await fetch(`https://decapi.me/twitch/viewcount/${TWITCH_CHANNEL}`);
          const gameReq = await fetch(`https://decapi.me/twitch/game/${TWITCH_CHANNEL}`);
          const titleReq = await fetch(`https://decapi.me/twitch/title/${TWITCH_CHANNEL}`);

          viewersElem.innerText = await viewReq.text();
          document.getElementById('twitch-game').innerText = await gameReq.text();
          titleElem.innerText = await titleReq.text() || "MOST ÉLŐBEN!";
        } else {
          badge.innerText = "OFFLINE";
          badge.className = "live-badge-inline offline";
          viewersElem.innerText = "0";
          document.getElementById('twitch-game').innerText = "Offline";
          titleElem.innerText = "A CSATORNA JELENLEG OFFLINE";
        }

        const followReq = await fetch(`https://decapi.me/twitch/followcount/${TWITCH_CHANNEL}`);
        const followCount = await followReq.text();
        if(!followCount.includes("error")) {
          document.getElementById('twitch-followers').innerText = followCount;
        }

        const avatarReq = await fetch(`https://decapi.me/twitch/avatar/${TWITCH_CHANNEL}`);
        const avatarUrl = await avatarReq.text();
        if(avatarUrl.startsWith("http")) {
          document.getElementById('twitch-avatar').src = avatarUrl;
        }

      } catch (err) {
        console.warn("API Hiba:", err);
      }
    }

    function openStreamModal() {
      document.getElementById('modal').classList.add('active');
      showModalTab('video');
    }

    function closeStreamModal() {
      document.getElementById('modal').classList.remove('active');
      document.getElementById('modal-body').innerHTML = '';
    }

    function showModalTab(tabType) {
      const body = document.getElementById('modal-body');
      const videoBtn = document.getElementById('tab-video-btn');
      const chatBtn = document.getElementById('tab-chat-btn');

      if (tabType === 'video') {
        videoBtn.classList.add('active');
        chatBtn.classList.remove('active');
        body.innerHTML = `<iframe src="https://player.twitch.tv/?channel=${TWITCH_CHANNEL}&parent=${currentDomain}&autoplay=true" allowfullscreen></iframe>`;
      } else {
        chatBtn.classList.add('active');
        videoBtn.classList.remove('active');
        body.innerHTML = `<iframe src="https://www.twitch.tv/embed/${TWITCH_CHANNEL}/chat?parent=${currentDomain}"></iframe>`;
      }
    }

    function setTheme(theme) {
      if (theme === 'purple') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', theme);
    }

    fetchTwitchData();
    setInterval(fetchTwitchData, 60000);
  </script>
</body>
