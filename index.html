<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SANCI9517 | Official Streamer Hub</title>
  
  <!-- ==========================================
     [SECTION 1: BETŰTÍPUSOK ÉS IKONOK]
     ========================================== -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- ==========================================
     [SECTION 2: CSS STÍLUSOK (DIZÁJN)]
     ========================================== -->
  <style>
    /* --- 2.1 STÍLUS VÁLTOZÓK & ALAPBEÁLLÍTÁSOK --- */
    :root {
      --bg-dark: #06040a;
      --card-bg: rgba(18, 10, 32, 0.75);
      --accent-purple: #a855f7;
      --glow-purple: #c084fc;
      --border-purple: rgba(168, 85, 247, 0.3);
      --text-main: #ffffff;
      --text-sub: #a78bfa;
    }

    [data-theme="green"] {
      --accent-purple: #10b981;
      --glow-purple: #34d399;
      --border-purple: rgba(16, 185, 129, 0.3);
      --card-bg: rgba(6, 30, 22, 0.75);
      --text-sub: #6ee7b7;
    }

    [data-theme="blue"] {
      --accent-purple: #3b82f6;
      --glow-purple: #60a5fa;
      --border-purple: rgba(59, 130, 246, 0.3);
      --card-bg: rgba(10, 22, 40, 0.75);
      --text-sub: #93c5fd;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(168, 85, 247, 0.18) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(59, 130, 246, 0.15) 0%, transparent 40%);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px 80px 15px;
    }

    /* --- 2.2 GLASSMORPHISM & ELEMEK KINÉZETE --- */
    header, .card-btn {
      background: var(--card-bg) !important;
      border: 1px solid var(--border-purple) !important;
      backdrop-filter: blur(16px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(16px) saturate(180%) !important;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37) !important;
    }

    header {
      border-radius: 20px;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .brand { display: flex; align-items: center; gap: 15px; }
    .avatar { 
      width: 60px; 
      height: 60px; 
      border-radius: 50%; 
      border: 2px solid var(--accent-purple); 
      box-shadow: 0 0 15px var(--accent-purple); 
    }
    .brand-text h1 { 
      font-family: 'Orbitron', sans-serif; 
      font-size: 1.4rem; 
      letter-spacing: 1.5px; 
      background: linear-gradient(to right, #fff, var(--text-sub));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-text p { font-size: 0.85rem; color: var(--text-sub); font-weight: 600; }

    .theme-switcher { 
      display: flex; 
      gap: 10px; 
      background: rgba(0,0,0,0.4); 
      border: 1px solid var(--border-purple); 
      padding: 8px 12px; 
      border-radius: 20px; 
    }
    .dot { width: 14px; height: 14px; border-radius: 50%; cursor: pointer; }
    .dot:hover { transform: scale(1.2); }
    .dot.purple { background: #a855f7; box-shadow: 0 0 8px #a855f7; }
    .dot.green { background: #10b981; box-shadow: 0 0 8px #10b981; }
    .dot.blue { background: #3b82f6; box-shadow: 0 0 8px #3b82f6; }

    /* --- 2.3 LINK GOMBOK --- */
    .section-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      color: var(--text-sub);
      letter-spacing: 2px;
      margin-top: 10px;
      margin-bottom: 5px;
      text-transform: uppercase;
      grid-column: 1 / -1;
    }

    .card-btn {
      border-radius: 14px;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: white;
      font-weight: 700;
      font-size: 1.1rem;
    }
    .card-btn:hover { 
      border-color: var(--glow-purple) !important; 
      transform: translateY(-3px) scale(1.01) !important; 
      box-shadow: 0 0 20px var(--border-purple) !important;
    }
    .card-left { display: flex; align-items: center; gap: 16px; }
    .card-left i { font-size: 1.5rem; color: var(--accent-purple); width: 25px; text-align: center; }

   /* ============================================================
/* ============================================================
       [SECTION 2.4: DESKTOP (WEB) LAYOUT - NEXT-GEN STREAMER HUB]
       ============================================================ */
    @media (min-width: 900px) {
      body {
        padding: 40px 30px;
        background: #040208;
        /* Többrétegű animált mesh fényfoltok */
        background-image: 
          radial-gradient(at 0% 0%, rgba(168, 85, 247, 0.22) 0px, transparent 50%),
          radial-gradient(at 100% 0%, rgba(59, 130, 246, 0.18) 0px, transparent 50%),
          radial-gradient(at 50% 100%, rgba(236, 72, 153, 0.15) 0px, transparent 50%);
        background-attachment: fixed;
      }
      
      .main-container {
        width: 100%;
        max-width: 1280px;
        display: grid;
        grid-template-columns: 380px 1fr;
        gap: 35px;
        align-items: start;
      }

      /* ULTIMATE STREAMER CARD (BAL OLDAL) */
      header {
        flex-direction: column;
        text-align: center;
        padding: 45px 30px;
        position: sticky;
        top: 30px;
        background: linear-gradient(145deg, rgba(20, 11, 38, 0.9), rgba(8, 4, 18, 0.95)) !important;
        border: 1px solid rgba(168, 85, 247, 0.4) !important;
        border-radius: 28px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(255,255,255,0.1) !important;
      }

      .avatar-wrapper {
        position: relative;
        display: inline-block;
        margin-bottom: 15px;
      }

      .avatar { 
        width: 130px; 
        height: 130px; 
        border-radius: 50%;
        border: 3px solid var(--accent-purple); 
        box-shadow: 0 0 30px var(--accent-purple);
      }

      .live-tag {
        position: absolute;
        bottom: 5px;
        left: 50%;
        transform: translateX(-50%);
        background: #ef4444;
        color: white;
        font-family: 'Orbitron', sans-serif;
        font-size: 0.65rem;
        font-weight: 900;
        padding: 3px 10px;
        border-radius: 20px;
        border: 2px solid #06040a;
        box-shadow: 0 0 10px #ef4444;
        letter-spacing: 1px;
      }

      .brand-text h1 {
        font-size: 2rem;
        letter-spacing: 2px;
        text-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
      }

      /* STATISZTIKAI COUNTEREK */
      .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        width: 100%;
        margin-top: 25px;
        padding-top: 20px;
        border-top: 1px solid rgba(255,255,255,0.08);
      }

      .stat-box {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.05);
        padding: 12px 10px;
        border-radius: 14px;
      }

      .stat-num {
        font-family: 'Orbitron', sans-serif;
        font-size: 1.1rem;
        font-weight: 800;
        color: #fff;
      }

      .stat-label {
        font-size: 0.75rem;
        color: var(--text-sub);
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      /* LINK CSOPORT (JOBB OLDAL) */
      .links-wrapper {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 18px;
      }

      /* FEATURED BANNER (A JOBB OLDAL TETEJÉN) */
      .hero-banner {
        grid-column: 1 / -1;
        background: linear-gradient(135deg, rgba(168, 85, 247, 0.2), rgba(59, 130, 246, 0.15));
        border: 1px solid var(--accent-purple);
        border-radius: 20px;
        padding: 25px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        margin-bottom: 10px;
      }

      .hero-text h2 {
        font-family: 'Orbitron', sans-serif;
        font-size: 1.2rem;
        color: #fff;
      }

      .hero-text p {
        color: var(--text-sub);
        font-size: 0.9rem;
      }

      .hero-btn {
        background: var(--accent-purple);
        color: #000;
        font-family: 'Orbitron', sans-serif;
        font-weight: 900;
        padding: 12px 22px;
        border-radius: 12px;
        text-decoration: none;
        box-shadow: 0 0 20px var(--accent-purple);
      }

      .hero-btn:hover {
        transform: scale(1.05);
        background: #fff;
      }

      .card-btn {
        padding: 22px;
        border-radius: 16px;
        background: rgba(14, 8, 28, 0.8) !important;
        border: 1px solid rgba(168, 85, 247, 0.2) !important;
      }

      .card-btn:hover {
        border-color: var(--glow-purple) !important;
        background: linear-gradient(135deg, rgba(30, 16, 58, 0.9), rgba(14, 8, 28, 0.95)) !important;
        transform: translateY(-4px) !important;
        box-shadow: 0 12px 30px rgba(168, 85, 247, 0.25) !important;
      }

      .floating-live-btn {
        bottom: 35px;
        right: 35px;
      }
    }
    /* --- 2.5 MOBIL LAYOUT (EGYOSZLOPOS NÉZET) --- */
    @media (max-width: 899px) {
      .main-container {
        width: 100%;
        max-width: 550px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .links-wrapper {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .floating-live-btn {
        bottom: 15px !important;
        right: 15px !important;
        padding: 10px 18px !important;
        font-size: 0.75rem !important;
      }
    }

    /* --- 2.6 LEBEGŐ "ÉLŐ ADÁS" GOMB A SAROKBAN --- */
    .floating-live-btn {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: linear-gradient(135deg, #ef4444, var(--accent-purple));
      border: 2px solid #ffffff;
      color: white;
      padding: 14px 24px;
      border-radius: 50px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: 900;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(239, 68, 68, 0.5);
      z-index: 999;
      animation: pulse-glow 2s infinite;
    }
    .floating-live-btn:hover { transform: scale(1.05); }

    .pulse-dot {
      width: 10px;
      height: 10px;
      background-color: #ffffff;
      border-radius: 50%;
      animation: blink 1s infinite;
    }

    @keyframes blink { 50% { opacity: 0.2; } }
    @keyframes pulse-glow {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    /* --- 2.7 LEUGRÓ ABLAK (STREAM & CHAT MODAL) --- */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(12px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      padding: 15px;
    }
    .modal-overlay.active { display: flex; }

    .modal-content {
      background: #090514;
      border: 2px solid var(--border-purple);
      border-radius: 20px;
      width: 100%;
      max-width: 850px;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(168, 85, 247, 0.3);
    }

    .modal-header {
      background: var(--card-bg);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-purple);
    }

    .modal-tabs { display: flex; gap: 10px; }
    .m-tab-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border-purple);
      color: white;
      padding: 8px 18px;
      border-radius: 10px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .m-tab-btn.active { 
      background: var(--accent-purple); 
      color: #000; 
      border-color: var(--glow-purple);
      box-shadow: 0 0 15px var(--accent-purple);
    }

    .close-btn {
      background: transparent;
      border: none;
      color: white;
      font-size: 1.8rem;
      cursor: pointer;
      line-height: 1;
    }
    .close-btn:hover { color: var(--accent-purple); }

    .modal-body {
      position: relative;
      width: 100%;
      height: 65vh;
      max-height: 520px;
      background: #000;
    }

    .modal-body iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- ==========================================
   <!-- ==========================================
     [SECTION 3: HTML SZERKEZET & TARTALOM]
     ========================================== -->
  <div class="main-container">

    <!-- FEJLÉC / PROFIL PANEL (BAL OLDAL WEBEN) -->
    <header>
      <div class="brand">
        <div class="avatar-wrapper">
          <img src="https://api.dicebear.com/7.x/bottts/svg?seed=sanci9517" class="avatar" alt="SANCI9517">
          <div class="live-tag">LIVE</div>
        </div>
        <div class="brand-text">
          <h1>SANCI9517</h1>
          <p>PRO STREAMER & CONTENT CREATOR</p>
        </div>
      </div>

      <!-- WEBES EXTRÁK: STATISZTIKA (WEBEN JELENIK MEG) -->
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-num">10K+</div>
          <div class="stat-label">Followers</div>
        </div>
        <div class="stat-box">
          <div class="stat-num">1080p</div>
          <div class="stat-label">60 FPS</div>
        </div>
      </div>

      <div class="theme-switcher">
        <div class="dot purple" onclick="setTheme('purple')"></div>
        <div class="dot green" onclick="setTheme('green')"></div>
        <div class="dot blue" onclick="setTheme('blue')"></div>
      </div>
    </header>

    <!-- TARTALOM ÉS LINKEK (JOBB OLDAL WEBEN) -->
    <div class="links-wrapper">

      <!-- PROFI HERO BANNER (CSAK DESKTOPON JELENIK MEG JÓL) -->
      <div class="hero-banner">
        <div class="hero-text">
          <h2>NÉZD AZ ÉLŐ ADÁST!</h2>
          <p>Minden nap pörgős gameplay és jó hangulat.</p>
        </div>
        <a href="javascript:void(0)" onclick="openStreamModal()" class="hero-btn"><i class="fa-solid fa-play"></i> ADÁS INDÍTÁSA</a>
      </div>

      <div class="section-title">🌐 HIVATALOS CSATORNÁK</div>

      <a href="https://www.twitch.tv/sanci9517" target="_blank" class="card-btn">
        <div class="card-left"><i class="fa-brands fa-twitch"></i><span>Twitch Csatorna</span></div>
        <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:0.85rem; color:var(--text-sub);"></i>
      </a>

      <a href="https://youtube.com" target="_blank" class="card-btn">
        <div class="card-left"><i class="fa-brands fa-youtube"></i><span>YouTube Csatorna</span></div>
        <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:0.85rem; color:var(--text-sub);"></i>
      </a>

      <a href="https://discord.gg" target="_blank" class="card-btn">
        <div class="card-left"><i class="fa-brands fa-discord"></i><span>Discord Szerver</span></div>
        <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:0.85rem; color:var(--text-sub);"></i>
      </a>

      <a href="https://tiktok.com" target="_blank" class="card-btn">
        <div class="card-left"><i class="fa-brands fa-tiktok"></i><span>TikTok Videók</span></div>
        <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:0.85rem; color:var(--text-sub);"></i>
      </a>

      <a href="https://instagram.com" target="_blank" class="card-btn">
        <div class="card-left"><i class="fa-brands fa-instagram"></i><span>Instagram Page</span></div>
        <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:0.85rem; color:var(--text-sub);"></i>
      </a>

    </div>

  </div>
  <!-- ==========================================
     [SECTION 4: JAVASCRIPT PROGRAMKÓD (LOGIKA)]
     ========================================== -->
  <script>
    // Automatikusan kezeli a domént a Twitch biztonsági előírásaihoz
    const currentDomain = window.location.hostname || "sanci9517.github.io";

    function openStreamModal() {
      document.getElementById('modal').classList.add('active');
      showModalTab('video');
      document.addEventListener('keydown', handleEscKey);
    }

    function closeStreamModal() {
      document.getElementById('modal').classList.remove('active');
      document.getElementById('modal-body').innerHTML = ''; // Bezáráskor leállítja a lejátszást
      document.removeEventListener('keydown', handleEscKey);
    }

    function handleEscKey(e) {
      if (e.key === "Escape") closeStreamModal();
    }

    function showModalTab(tabType) {
      const body = document.getElementById('modal-body');
      const videoBtn = document.getElementById('tab-video-btn');
      const chatBtn = document.getElementById('tab-chat-btn');

      if(tabType === 'video') {
        videoBtn.classList.add('active');
        chatBtn.classList.remove('active');
        body.innerHTML = `<iframe src="https://player.twitch.tv/?channel=sanci9517&parent=${currentDomain}&autoplay=true" allowfullscreen></iframe>`;
      } else {
        chatBtn.classList.add('active');
        videoBtn.classList.remove('active');
        body.innerHTML = `<iframe src="https://www.twitch.tv/embed/sanci9517/chat?parent=${currentDomain}"></iframe>`;
      }
    }

    function setTheme(theme) {
      if(theme === 'purple') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', theme);
    }
  </script>
</body>
</html>
