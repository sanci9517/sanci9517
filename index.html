<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SANCI9517 | Official Streamer Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #030206;
      --accent-purple: #9d4edd;
      --glow-purple: #c77dff;
      --card-bg: rgba(18, 10, 30, 0.85);
      --card-border: rgba(157, 78, 221, 0.35);
      --text-bright: #ffffff;
      --text-sub: #c3b8db;
    }

    [data-theme="green"] {
      --accent-purple: #00f5d4;
      --glow-purple: #57cc99;
      --card-bg: rgba(5, 25, 20, 0.85);
      --card-border: rgba(0, 245, 212, 0.35);
    }

    [data-theme="blue"] {
      --accent-purple: #00b4d8;
      --glow-purple: #90e0ef;
      --card-bg: rgba(8, 20, 35, 0.85);
      --card-border: rgba(0, 180, 216, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.25s ease; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-bright);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* GLOW BACKGROUND */
    .bg-glow-1, .bg-glow-2 {
      position: fixed; width: 400px; height: 400px; border-radius: 50%;
      background: radial-gradient(circle, var(--accent-purple) 0%, transparent 70%);
      opacity: 0.2; filter: blur(90px); z-index: -1;
    }
    .bg-glow-1 { top: -50px; left: -50px; }
    .bg-glow-2 { bottom: -50px; right: -50px; }

    /* FEJLÉC */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 15px 5%; background: rgba(3, 2, 6, 0.8); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border); position: sticky; top: 0; z-index: 100;
    }
    .profile-info { display: flex; align-items: center; gap: 12px; }
    .avatar { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--accent-purple); }
    h1 { font-family: 'Orbitron', sans-serif; font-size: 1.3rem; letter-spacing: 1px; }

    .theme-switcher { display: flex; gap: 10px; background: rgba(255,255,255,0.05); padding: 5px 10px; border-radius: 20px; border: 1px solid var(--card-border); }
    .dot { width: 14px; height: 14px; border-radius: 50%; cursor: pointer; border: 1px solid rgba(255,255,255,0.8); }
    .dot.purple { background: #9d4edd; } .dot.green { background: #00f5d4; } .dot.blue { background: #00b4d8; }

    /* ==========================================================================
       1. MOBIL NÉZET (Alapértelmezett, kisképernyős beállítások)
       ========================================================================== */
    .mobile-view { display: block; padding: 20px 15px 90px 15px; }
    .desktop-view { display: none; }

    .tab-content { display: none; }
    .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      padding: 16px; border-radius: 12px; text-decoration: none; color: white;
      display: flex; align-items: center; gap: 15px; font-weight: 700; font-size: 1rem;
      margin-bottom: 12px;
    }
    .card i { font-size: 1.4rem; color: var(--accent-purple); width: 25px; text-align: center; }

    .stream-container {
      position: relative; width: 100%; padding-top: 56.25%; background: #000;
      border-radius: 12px; overflow: hidden; border: 1px solid var(--card-border);
    }
    .stream-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

    /* MOBIL ALSÓ MENÜBAR */
    .mobile-nav {
      position: fixed; bottom: 0; left: 0; width: 100%; height: 70px;
      background: rgba(10, 5, 20, 0.95); backdrop-filter: blur(20px);
      border-top: 1px solid var(--card-border); display: flex;
      justify-content: space-around; align-items: center; z-index: 1000;
    }
    .nav-btn {
      background: transparent; border: none; color: var(--text-sub);
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      font-family: 'Orbitron', sans-serif; font-size: 0.65rem; cursor: pointer; width: 25%;
    }
    .nav-btn i { font-size: 1.2rem; }
    .nav-btn.active { color: var(--accent-purple); font-weight: 800; }

    /* ==========================================================================
       2. WEBES / ASZTALI NÉZET (Képernyő szélesség: 900px felett)
       ========================================================================== */
    @media (min-width: 900px) {
      .mobile-view { display: none; }
      .mobile-nav { display: none; }
      .desktop-view { display: grid; grid-template-columns: 1.8fr 1.2fr; gap: 25px; padding: 30px 5%; max-width: 1400px; margin: 0 auto; }

      .desktop-left, .desktop-right { display: flex; flex-direction: column; gap: 20px; }

      .section-title {
        font-family: 'Orbitron', sans-serif; font-size: 1.1rem;
        color: var(--accent-purple); margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
      }

      .card-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .card { margin-bottom: 0; }
      .card:hover { transform: translateY(-3px); border-color: var(--glow-purple); }

      .sched-box {
        background: var(--card-bg); border: 1px solid var(--card-border);
        padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center;
      }
      .badge { background: var(--accent-purple); color: #000; padding: 4px 8px; border-radius: 4px; font-weight: 800; font-family: 'Orbitron'; font-size: 0.75rem; }
    }
  </style>
</head>
<body>

  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <!-- KÖZÖS FEJLÉC -->
  <header>
    <div class="profile-info">
      <img src="https://api.dicebear.com/7.x/bottts/svg?seed=sanci9517" class="avatar" alt="SANCI9517">
      <div>
        <h1>SANCI9517</h1>
        <p style="font-size: 0.75rem; color: var(--text-sub);">STREAMER HUB</p>
      </div>
    </div>
    <div class="theme-switcher">
      <div class="dot purple" onclick="setTheme('purple')"></div>
      <div class="dot green" onclick="setTheme('green')"></div>
      <div class="dot blue" onclick="setTheme('blue')"></div>
    </div>
  </header>

  <!-- 💻 1. WEBES / ASZTALI NÉZET (DASHBOARD ELRENDEZÉS) -->
  <div class="desktop-view">
    <div class="desktop-left">
      <div class="section-title"><i class="fa-solid fa-tv"></i> ÉLŐ STREAM</div>
      <div class="stream-container" id="twitch-embed-desktop"></div>
    </div>

    <div class="desktop-right">
      <div class="section-title"><i class="fa-solid fa-link"></i> ELÉRHETŐSÉGEK</div>
      <div class="card-grid">
        <a href="https://www.twitch.tv/sanci9517" target="_blank" class="card"><i class="fa-brands fa-twitch"></i> Twitch</a>
        <a href="https://youtube.com" target="_blank" class="card"><i class="fa-brands fa-youtube"></i> YouTube</a>
        <a href="https://discord.gg" target="_blank" class="card"><i class="fa-brands fa-discord"></i> Discord</a>
        <a href="https://tiktok.com" target="_blank" class="card"><i class="fa-brands fa-tiktok"></i> TikTok</a>
      </div>

      <div class="section-title" style="margin-top: 15px;"><i class="fa-solid fa-calendar"></i> MENETREND</div>
      <div class="sched-box"><span class="badge">HÉTFŐ</span> <strong>GTA V RP</strong> <span>18:00</span></div>
      <div class="sched-box"><span class="badge">SZERDA</span> <strong>Valorant</strong> <span>19:00</span></div>
      <div class="sched-box"><span class="badge">PÉNTEK</span> <strong>Nézői Játékok</strong> <span>20:00</span></div>
    </div>
  </div>

  <!-- 📱 2. MOBIL NÉZET (APP ELRENDEZÉS FÜLEKKEL) -->
  <div class="mobile-view">
    <!-- LINKS TAB -->
    <div id="m-links" class="tab-content active">
      <a href="https://www.twitch.tv/sanci9517" target="_blank" class="card"><i class="fa-brands fa-twitch"></i> Twitch Csatorna</a>
      <a href="https://youtube.com" target="_blank" class="card"><i class="fa-brands fa-youtube"></i> YouTube Videók</a>
      <a href="https://discord.gg" target="_blank" class="card"><i class="fa-brands fa-discord"></i> Discord Közösség</a>
      <a href="https://tiktok.com" target="_blank" class="card"><i class="fa-brands fa-tiktok"></i> TikTok Clips</a>
    </div>

    <!-- STREAM TAB -->
    <div id="m-stream" class="tab-content">
      <div class="stream-container" id="twitch-embed-mobile"></div>
    </div>

    <!-- SCHEDULE TAB -->
    <div id="m-schedule" class="tab-content">
      <div class="card" style="justify-content: space-between;"><span style="color:var(--accent-purple);">HÉTFŐ</span> <strong>GTA V RP</strong> <span>18:00</span></div>
      <div class="card" style="justify-content: space-between;"><span style="color:var(--accent-purple);">SZERDA</span> <strong>Valorant</strong> <span>19:00</span></div>
      <div class="card" style="justify-content: space-between;"><span style="color:var(--accent-purple);">PÉNTEK</span> <strong>Nézői Játékok</strong> <span>20:00</span></div>
    </div>
  </div>

  <!-- MOBIL ALSÓ MENÜ -->
  <div class="mobile-nav">
    <button class="nav-btn active" onclick="openMobileTab('m-links', this)"><i class="fa-solid fa-house"></i><span>LINKS</span></button>
    <button class="nav-btn" onclick="openMobileTab('m-stream', this)"><i class="fa-solid fa-tv"></i><span>STREAM</span></button>
    <button class="nav-btn" onclick="openMobileTab('m-schedule', this)"><i class="fa-solid fa-calendar"></i><span>ADÁS</span></button>
  </div>

  <script src="https://embed.twitch.tv/embed/v1.js"></script>
  <script>
    function openMobileTab(tabId, btn) {
      document.querySelectorAll('.mobile-view .tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.mobile-nav .nav-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    function setTheme(theme) {
      if(theme === 'purple') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', theme);
    }

    // A megfelelő képernyőmérethez töltjük be a Twitchet
    const isDesktop = window.innerWidth >= 900;
    new Twitch.Embed(isDesktop ? "twitch-embed-desktop" : "twitch-embed-mobile", {
      width: "100%", height: "100%", channel: "sanci9517", parent: ["sanci9517.github.io"]
    });
  </script>
</body>
</html>
