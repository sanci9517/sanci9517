<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SANCI9517 | Official Streamer Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #090514;
      --card-bg: rgba(22, 12, 38, 0.9);
      --accent-purple: #a855f7;
      --glow-purple: #c084fc;
      --border-purple: rgba(168, 85, 247, 0.4);
      --text-main: #ffffff;
      --text-sub: #a78bfa;
    }

    [data-theme="green"] {
      --accent-purple: #10b981;
      --glow-purple: #34d399;
      --border-purple: rgba(16, 185, 129, 0.4);
      --card-bg: rgba(6, 30, 22, 0.9);
      --text-sub: #6ee7b7;
    }

    [data-theme="blue"] {
      --accent-purple: #3b82f6;
      --glow-purple: #60a5fa;
      --border-purple: rgba(59, 130, 246, 0.4);
      --card-bg: rgba(10, 22, 40, 0.9);
      --text-sub: #93c5fd;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.2s ease; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px 40px 15px;
    }

    header {
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .avatar { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--accent-purple); box-shadow: 0 0 10px var(--accent-purple); }
    h1 { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; letter-spacing: 1px; }

    .theme-switcher { display: flex; gap: 8px; background: var(--card-bg); border: 1px solid var(--border-purple); padding: 6px 12px; border-radius: 20px; }
    .dot { width: 14px; height: 14px; border-radius: 50%; cursor: pointer; }
    .dot.purple { background: #a855f7; } .dot.green { background: #10b981; } .dot.blue { background: #3b82f6; }

    .main-container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 14px; }

    .section-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      color: var(--text-sub);
      letter-spacing: 1.5px;
      margin-top: 10px;
      margin-bottom: 2px;
    }

    /* EGYETLEN KIEMELT STREAM GOMB */
    .stream-main-btn {
      background: linear-gradient(135deg, var(--accent-purple), rgba(15, 5, 30, 0.95));
      border: 2px solid var(--glow-purple);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      color: white;
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.35);
    }
    .stream-main-btn:hover, .stream-main-btn:active { transform: scale(1.02); }
    .stream-btn-left { display: flex; align-items: center; gap: 15px; }
    .stream-btn-left i { font-size: 2rem; color: #fff; }
    .stream-btn-text h3 { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; }
    .stream-btn-text p { font-size: 0.85rem; color: var(--text-sub); }

    /* NORMÁL LINK GOMBOK */
    .card-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-purple);
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: white;
      font-weight: 700;
      font-size: 1.05rem;
    }
    .card-btn:hover { border-color: var(--glow-purple); transform: translateX(3px); }
    .card-left { display: flex; align-items: center; gap: 15px; }
    .card-left i { font-size: 1.4rem; color: var(--accent-purple); width: 25px; text-align: center; }

    /* MODAL (LEUGRÓ ABLAK) */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 15px;
    }
    .modal-overlay.active { display: flex; }

    .modal-content {
      background: #000;
      border: 2px solid var(--border-purple);
      border-radius: 16px;
      width: 100%;
      max-width: 800px;
      overflow: hidden;
    }

    .modal-header {
      background: var(--card-bg);
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-purple);
    }

    /* MODAL FÜLEK (STREAM ÉS CHAT VÁLTÁSA) */
    .modal-tabs { display: flex; gap: 8px; }
    .m-tab-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border-purple);
      color: white;
      padding: 6px 14px;
      border-radius: 8px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .m-tab-btn.active { background: var(--accent-purple); color: #000; font-weight: 800; }

    .close-btn {
      background: transparent;
      border: none;
      color: white;
      font-size: 1.6rem;
      cursor: pointer;
    }

    .modal-body {
      position: relative;
      width: 100%;
      height: 65vh;
      max-height: 500px;
    }

    .modal-body iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
