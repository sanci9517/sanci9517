<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SANCI9517 | Streamer Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #090514;
      --card-bg: rgba(22, 12, 38, 0.9);
      --accent-purple: #a855f7;
      --border-purple: rgba(168, 85, 247, 0.4);
      --text-main: #ffffff;
      --text-sub: #a78bfa;
    }

    [data-theme="green"] {
      --accent-purple: #10b981;
      --border-purple: rgba(16, 185, 129, 0.4);
      --card-bg: rgba(6, 30, 22, 0.9);
      --text-sub: #6ee7b7;
    }

    [data-theme="blue"] {
      --accent-purple: #3b82f6;
      --border-purple: rgba(59, 130, 246, 0.4);
      --card-bg: rgba(10, 22, 40, 0.9);
      --text-sub: #93c5fd;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
    }

    header {
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .avatar { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--accent-purple); }
    h1 { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; }

    .theme-switcher { display: flex; gap: 8px; background: var(--card-bg); border: 1px solid var(--border-purple); padding: 5px 10px; border-radius: 20px; }
    .dot { width: 14px; height: 14px; border-radius: 50%; cursor: pointer; }
    .dot.purple { background: #a855f7; } .dot.green { background: #10b981; } .dot.blue { background: #3b82f6; }

    /* STREAM ÉS CHAT TÁROLÓ */
    .stream-layout {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 25px;
    }

    /* MOBIL FÜLEK (CHAT ÉS LIVE KÜLÖNVÁLASZTÁSA MOBILON) */
    .stream-tabs {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .s-tab-btn {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border-purple);
      color: var(--text-main);
      padding: 12px;
      border-radius: 10px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .s-tab-btn.active {
      background: var(--accent-purple);
      color: #000;
      font-weight: 800;
    }

    /* KÜLÖNÁLLÓ DOBOZOK */
    .video-box, .chat-box {
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid var(--border-purple);
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }

    .video-box {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 arány */
    }

    .video-box iframe, .chat-box iframe {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%; border: none;
    }

    .chat-box {
      position: relative;
      width: 100%;
      height: 450px; /* Fix magasság a chatnek */
      display: none; /* Mobilon alapból rejtve, füllel váltható */
    }

    .chat-box.active { display: block; }
    .video-box.active { display: block; }

    /* LINKKÁRTYÁK */
    .links-grid {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
    }

    .card-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-purple);
      border-radius: 12px;
      padding: 15px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: white;
      font-weight: 700;
    }
    .card-btn i { font-size: 1.4rem; color: var(--accent-purple); }

    /* WEBES / ASZTALI ELRENDEZÉS (SZÁMÍTÓGÉPEN EGYMÁS MELLETT VANNAK) */
    @media (min-width: 850px) {
      .stream-tabs { display: none; } /* Gépen nincs szükség fülekre */
      
      .stream-layout {
        display: grid;
        grid-template-columns: 1fr 340px; /* Balra videó, jobbra chat */
        gap: 20px;
      }

      .video-box, .chat-box { display: block !important; }
      .chat-box { height: 100%; min-height: 400px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <img src="https://api.dicebear.com/7.x/bottts/svg?seed=sanci9517" class="avatar" alt="SANCI9517">
      <h1>SANCI9517</h1>
    </div>
    <div class="theme-switcher">
      <div class="dot purple" onclick="setTheme('purple')"></div>
      <div class="dot green" onclick="setTheme('green')"></div>
      <div class="dot blue" onclick="setTheme('blue')"></div>
    </div>
  </header>

  <div class="stream-layout">
    <div class="stream-tabs">
      <button class="s-tab-btn active" onclick="switchStreamTab('video', this)"><i class="fa-solid fa-play"></i> LIVE VIDEO</button>
      <button class="s-tab-btn" onclick="switchStreamTab('chat', this)"><i class="fa-solid fa-comments"></i> CHAT</button>
    </div>

    <div class="video-box active" id="video-container">
      <iframe src="https://player.twitch.tv/?channel=sanci9517&parent=sanci9517.github.io&autoplay=false" allowfullscreen></iframe>
    </div>

    <div class="chat-box" id="chat-container">
      <iframe src="https://www.twitch.tv/embed/sanci9517/chat?parent=sanci9517.github.io"></iframe>
    </div>
  </div>

  <div class="links-grid">
    <a href="https://www.twitch.tv/sanci9517" target="_blank" class="card-btn"><i class="fa-brands fa-twitch"></i> Twitch Csatorna</a>
    <a href="https://youtube.com" target="_blank" class="card-btn"><i class="fa-brands fa-youtube"></i> YouTube Videók</a>
    <a href="https://discord.gg" target="_blank" class="card-btn"><i class="fa-brands fa-discord"></i> Discord Szerver</a>
    <a href="https://tiktok.com" target="_blank" class="card-btn"><i class="fa-brands fa-tiktok"></i> TikTok Clips</a>
  </div>

  <script>
    function switchStreamTab(type, btn) {
      document.querySelectorAll('.s-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      if(type === 'video') {
        document.getElementById('video-container').classList.add('active');
        document.getElementById('chat-container').classList.remove('active');
      } else {
        document.getElementById('video-container').classList.remove('active');
        document.getElementById('chat-container').classList.add('active');
      }
    }

    function setTheme(theme) {
      if(theme === 'purple') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', theme);
    }
  </script>
</body>
</html>
