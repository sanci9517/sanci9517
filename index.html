<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teszt Oldal</title>
  <style>
    body { background: #111; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
    button { padding: 15px 25px; margin: 10px; font-size: 18px; cursor: pointer; background: #a855f7; color: white; border: none; border-radius: 8px; }
    .box { display: none; padding: 20px; background: #222; margin-top: 20px; border-radius: 8px; }
    .box.active { display: block; }
  </style>
</head>
<body>

  <h1>SANCI9517 TEST</h1>
  
  <button onclick="showSection('home')">Főoldal</button>
  <button onclick="showSection('setup')">Setup</button>

  <div id="home" class="box active">
    <h2>FŐOLDAL TARTALMA</h2>
    <p><a href="https://m.twitch.tv/sanci9517" style="color:#a855f7;">Kattints ide a Twitch-ért</a></p>
  </div>

  <div id="setup" class="box">
    <h2>SETUP TARTALMA</h2>
    <p>PC: RTX 4070 Ti, Ryzen 7800X3D</p>
  </div>

  <script>
    function showSection(id) {
      document.querySelectorAll('.box').forEach(el => el.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }
  </script>

</body>
</html>
