  <!-- ==========================================
     [SECTION 1: BETŰTÍPUSOK ÉS IKONOK]
     ========================================== -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- ==========================================
     [SECTION 2: CSS STÍLUSOK (DIZÁJN ÉS SZÍNEK)]
     ========================================== -->
  <style>
    /* --- 2.1 ALAP SZÍNVÁLTOZÓK & HÁTTÉR --- */
    :root {
      --bg-dark: #07040d;
      --card-bg-primary: #120a22;
      --card-bg-secondary: #1a0f30;
      --card-bg-accent: #231242;
      
      --accent-purple: #a855f7;
      --accent-pink: #ec4899;
      --accent-blue: #3b82f6;
      --accent-red: #ef4444;
      --accent-green: #10b981;

      --border-purple: rgba(168, 85, 247, 0.35);
      --border-pink: rgba(236, 72, 153, 0.35);

      --text-main: #ffffff;
      --text-sub: #c084fc;
      --text-muted: #94a3b8;
    }

    [data-theme="green"] {
      --accent-purple: #10b981;
      --accent-pink: #06b6d4;
      --border-purple: rgba(16, 185, 129, 0.4);
      --card-bg-primary: #061e16;
      --card-bg-secondary: #0b2d22;
      --text-sub: #6ee7b7;
    }

    [data-theme="blue"] {
      --accent-purple: #3b82f6;
      --accent-pink: #6366f1;
      --border-purple: rgba(59, 130, 246, 0.4);
      --card-bg-primary: #0a1628;
      --card-bg-secondary: #11223f;
      --text-sub: #93c5fd;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(168, 85, 247, 0.2) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(59, 130, 246, 0.18) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(236, 72, 153, 0.12) 0%, transparent 60%);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px 100px 15px;
    }

    /* --- 2.2 KÁRTYÁK LEBEGŐ EFFEKTJEI --- */
    header, .hero-card, .card-btn, .stat-box {
      border-radius: 20px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    /* --- 2.3 WEBES (DESKTOP) BENTO GRID LAYOUT --- */
    @media (min-width: 900px) {
      body {
        padding: 50px 20px 120px 20px;
      }

      .main-container {
        width: 100%;
        max-width: 1150px;
        display: grid;
        grid-template-columns: 340px 1fr 1fr;
        gap: 22px;
        align-items: stretch;
      }

      header {
        grid-column: 1 / 2;
        grid-row: 1 / 5;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        text-align: center;
        padding: 40px 24px;
        background: linear-gradient(180deg, var(--card-bg-primary), #0c0617) !important;
        border: 2px solid var(--border-purple) !important;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6) !important;
      }

      .hero-card {
        grid-column: 2 / 4;
        background: linear-gradient(135deg, var(--card-bg-secondary), var(--card-bg-accent)) !important;
        border: 2px solid var(--accent-purple) !important;
        padding: 28px 32px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 10px 30px rgba(168, 85, 247, 0.2) !important;
      }

      .links-wrapper {
        display: contents;
      }

      .card-btn {
        min-height: 85px;
        padding: 20px 24px;
      }

      .card-btn.wide {
        grid-column: 2 / 4;
      }
    }

    /* --- 2.4 MOBIL LAYOUT (EGYOSZLOPOS) --- */
    @media (max-width: 899px) {
      .main-container {
        width: 100%;
        max-width: 550px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      header {
        padding: 24px 20px;
        background: var(--card-bg-primary);
        border: 1px solid var(--border-purple);
        display: flex;
        flex-direction: column;
        gap: 18px;
        text-align: center;
      }

      .hero-card {
        background: linear-gradient(135deg, var(--card-bg-secondary), var(--card-bg-accent));
        border: 1px solid var(--accent-purple);
        padding: 20px;
        border-radius: 18px;
        display: flex;
        flex-direction: column;
        gap: 15px;
        text-align: center;
      }

      .links-wrapper {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
    }

    /* --- 2.5 KÁRTYA ELEMEK ÉS PROFIL STÍLUS --- */
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .avatar-container {
      position: relative;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 3px solid var(--accent-purple);
      box-shadow: 0 0 25px var(--accent-purple);
      object-fit: cover;
    }

    .live-badge-inline {
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.65rem;
      font-weight: 900;
      padding: 3px 10px;
      border-radius: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .live-badge-inline.online {
      background: var(--accent-red);
      color: #fff;
      box-shadow: 0 0 12px var(--accent-red);
      animation: blink-red 1.5s infinite;
    }

    .live-badge-inline.offline {
      background: #334155;
      color: #94a3b8;
    }

    .brand-text h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.7rem;
      letter-spacing: 2px;
      background: linear-gradient(to right, #ffffff, var(--text-sub));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-text p {
      font-size: 0.85rem;
      color: var(--text-sub);
      font-weight: 700;
      letter-spacing: 1px;
    }

    /* TWITCH DINAMIKUS ADAT BLOKK */
    .stats-box {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-purple);
      padding: 16px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .stat-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
    }

    .stat-label { color: var(--text-muted); font-weight: 600; }
    .stat-value { font-family: 'Orbitron'; font-weight: 800; color: #fff; }

    /* CSATORNA GOMBOK EGYEDI MÁRKASZÍNEKKEL */
    .card-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: white;
      font-weight: 700;
      font-size: 1.1rem;
      border-radius: 16px;
      background: var(--card-bg-secondary) !important;
      border: 1px solid var(--border-purple) !important;
    }

    .card-btn.twitch { border-left: 5px solid #9146FF !important; }
    .card-btn.youtube { border-left: 5px solid #FF0000 !important; }
    .card-btn.tiktok  { border-left: 5px solid #00F2FE !important; }
    .card-btn.x-twitter { border-left: 5px solid #FFFFFF !important; }

    .card-btn:hover {
      transform: translateY(-4px) scale(1.01) !important;
      box-shadow: 0 10px 25px rgba(168, 85, 247, 0.3) !important;
      background: var(--card-bg-accent) !important;
    }

    .card-left { display: flex; align-items: center; gap: 16px; }
    .card-left i { font-size: 1.5rem; width: 30px; text-align: center; }

    .twitch i { color: #a970ff; }
    .youtube i { color: #ff4d4d; }
    .tiktok i  { color: #00f2fe; }
    .x-twitter i { color: #ffffff; }

    .theme-switcher {
      display: flex;
      gap: 12px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-purple);
      padding: 8px 14px;
      border-radius: 20px;
    }

    .dot { width: 14px; height: 14px; border-radius: 50%; cursor: pointer; }
    .dot:hover { transform: scale(1.25); }
    .dot.purple { background: #a855f7; box-shadow: 0 0 10px #a855f7; }
    .dot.green  { background: #10b981; box-shadow: 0 0 10px #10b981; }
    .dot.blue   { background: #3b82f6; box-shadow: 0 0 10px #3b82f6; }

    /* --- 2.6 LEBEGŐ "ÉLŐ ADÁS" GOMB --- */
    .floating-live-btn {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: linear-gradient(135deg, #ef4444, #a855f7);
      border: 2px solid #ffffff;
      color: white;
      padding: 14px 24px;
      border-radius: 50px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: 900;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(239, 68, 68, 0.6);
      z-index: 999;
      animation: pulse-glow 2s infinite;
    }

    .floating-live-btn:hover { transform: scale(1.08); }

    .pulse-dot {
      width: 10px;
      height: 10px;
      background-color: #ffffff;
      border-radius: 50%;
      animation: blink 1s infinite;
    }

    @keyframes blink { 50% { opacity: 0.2; } }
    @keyframes blink-red { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    @keyframes pulse-glow {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 18px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    /* --- 2.7 STREAM & CHAT MODAL --- */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(14px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      padding: 15px;
    }
    .modal-overlay.active { display: flex; }

    .modal-content {
      background: #0a0518;
      border: 2px solid var(--border-purple);
      border-radius: 20px;
      width: 100%;
      max-width: 900px;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(168, 85, 247, 0.4);
    }

    .modal-header {
      background: var(--card-bg-primary);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-purple);
    }

    .modal-tabs { display: flex; gap: 10px; }
    .m-tab-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-purple);
      color: white;
      padding: 8px 18px;
      border-radius: 10px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .m-tab-btn.active {
      background: var(--accent-purple);
      color: #000;
      border-color: #fff;
      box-shadow: 0 0 15px var(--accent-purple);
    }

    .close-btn {
      background: transparent;
      border: none;
      color: white;
      font-size: 1.8rem;
      cursor: pointer;
    }
    .close-btn:hover { color: var(--accent-red); }

    .modal-body {
      position: relative;
      width: 100%;
      height: 65vh;
      max-height: 540px;
      background: #000;
    }

    .modal-body iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>

  <script>
    const TWITCH_CHANNEL = "sanci9517";
    const currentDomain = window.location.hostname || "localhost";

    // --- 4.1 TWITCH ADATOK LEKÉRDEZÉSE ---
    async function fetchTwitchData() {
      try {
        const response = await fetch(`https://decapi.me/twitch/uptime/${TWITCH_CHANNEL}`);
        const uptimeText = await response.text();

        const isLive = !uptimeText.includes("offline") && !uptimeText.includes("error");
        
        const badge = document.getElementById('live-status-badge');
        const viewersElem = document.getElementById('twitch-viewers');
        const titleElem = document.getElementById('stream-title');
        const subtitleElem = document.getElementById('stream-subtitle');

        if (isLive) {
          badge.innerText = "LIVE";
          badge.className = "live-badge-inline online";
          
          const viewReq = await fetch(`https://decapi.me/twitch/viewcount/${TWITCH_CHANNEL}`);
          const gameReq = await fetch(`https://decapi.me/twitch/game/${TWITCH_CHANNEL}`);
          const titleReq = await fetch(`https://decapi.me/twitch/title/${TWITCH_CHANNEL}`);

          viewersElem.innerText = await viewReq.text();
          document.getElementById('twitch-game').innerText = await gameReq.text();
          
          const currentTitle = await titleReq.text();
          titleElem.innerText = currentTitle || "MOST ÉLŐBEN!";
          subtitleElem.innerText = `Kattints és csatlakozz az élő adáshoz!`;
        } else {
          badge.innerText = "OFFLINE";
          badge.className = "live-badge-inline offline";
          viewersElem.innerText = "0";
          document.getElementById('twitch-game').innerText = "Offline";
          titleElem.innerText = "A CSATORNA JELENLEG OFFLINE";
          subtitleElem.innerText = "Kövess be Twitch-en, hogy ne maradj le a következő adásról!";
        }

        const followReq = await fetch(`https://decapi.me/twitch/followcount/${TWITCH_CHANNEL}`);
        const followCount = await followReq.text();
        if(!followCount.includes("error")) {
          document.getElementById('twitch-followers').innerText = followCount;
        }

        const avatarReq = await fetch(`https://decapi.me/twitch/avatar/${TWITCH_CHANNEL}`);
        const avatarUrl = await avatarReq.text();
        if(avatarUrl.startsWith("http")) {
          document.getElementById('twitch-avatar').src = avatarUrl;
        }

      } catch (err) {
        console.warn("Twitch API lekérdezési hiba:", err);
      }
    }

    // --- 4.2 MODAL KEZELÉS ---

      document.getElementById('modal').classList.add('active');
      showModalTab('video');
      document.addEventListener('keydown', handleEscKey);

      document.getElementById('modal-body').innerHTML = '';
      document.removeEventListener('keydown', handleEscKey);
    }

      if (e.key === "Escape") closeStreamModal();
    }
